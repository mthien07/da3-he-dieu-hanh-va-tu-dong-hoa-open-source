name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      box:
        description: "Chạy cả kiểm thử OneBee Box (tải ~6 GB image, ~15 phút)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Kiểm tra cú pháp (shellcheck, yamllint, ansible-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Cài công cụ kiểm tra
        run: pip install -r requirements-dev.txt
      - name: shellcheck
        run: >-
          shellcheck -e SC2016 desktop/*.sh desktop/ansible/roles/backup-client/files/onebee-sao-luu
          desktop/ansible/roles/ho-tro-tu-xa/files/onebee-ho-tro box/ansible/roles/box-firewall/files/onebee-tuong-lua
          box/*.sh box/ansible/roles/box-stack/files/onebee-ca.sh tests/desktop/*.sh tests/desktop/extended/*.sh tests/box/*.sh
      # Test Caddyfile HTTPS chạy Caddy THẬT: lấy đúng binary từ image đã ghim digest trong group_vars (không tải từ nơi khác)
      - name: Lấy caddy từ image đã ghim digest
        run: |
          img="$(grep -oP '^  caddy: \K\S+' box/ansible/group_vars/all.yml)"
          docker create --name caddy-tmp "${img}" >/dev/null
          docker cp caddy-tmp:/usr/bin/caddy /tmp/caddy && docker rm caddy-tmp >/dev/null
          echo "ONEBEE_TEST_CADDY=/tmp/caddy" >> "$GITHUB_ENV"
      - name: Kiểm thử đơn vị (Python) + mẫu Jinja đọc được
        run: |
          sudo apt-get install -y -q apache2-utils openssh-client   # test lệnh shell của onebee-box dùng htpasswd, ssh-keygen thật
          python3 -m unittest discover -s tests/box -p 'test_*.py'
          python3 -m unittest discover -s tests/desktop -p 'test_*.py'
          python3 -m unittest tests/ai/test_scoring_and_report.py
          python3 tests/kiem-tra-mau-jinja.py
      - name: yamllint
        run: yamllint .
      - name: ansible-lint (Desktop)
        working-directory: desktop/ansible
        run: ansible-lint site.yml
      - name: ansible-lint (Box)
        working-directory: box/ansible
        run: ansible-lint site.yml

  desktop-mint:
    name: Desktop — cài thử trên Linux Mint 22.3 (container)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Cài 2 lần + kiểm tra kết quả
        run: tests/desktop/run-desktop-test-in-mint-container.sh

  desktop-extended:
    name: Desktop — kiểm thử mở rộng (gõ Telex thật, file Word, systemd, Unikey, Ubuntu)
    runs-on: ubuntu-24.04
    needs: desktop-mint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: 5 kịch bản
        run: tests/desktop/run-desktop-extended-tests.sh

  box:
    name: Box — cài thử + AI + sao lưu/khôi phục (Docker lồng)
    if: github.event_name == 'workflow_dispatch' && inputs.box
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Dọn chỗ trống trên máy CI
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Kiểm thử Box
        run: tests/box/run-box-test-in-systemd-container.sh
