name: Phát hành

# Tạo bản phát hành trên GitHub (đóng gói + SHA256SUMS), 1 trong 2 cách:
#   - gắn tag vX.Y.Z (hoặc vX.Y.Z-rc.N = bản thử) rồi đẩy tag;
#   - đẩy nhánh phat-hanh/vX.Y.Z → workflow tự tạo tag vX.Y.Z tại commit đó (dùng khi môi trường không đẩy được tag).
on:
  push:
    tags: ["v*"]
    branches: ["phat-hanh/v*"]

permissions:
  contents: write

jobs:
  phat-hanh:
    name: Đóng gói và tạo bản phát hành
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Xác định tag
        run: echo "TAG=${GITHUB_REF_NAME#phat-hanh/}" >> "$GITHUB_ENV"
      - name: Đóng gói (kiểm phiên bản khớp group_vars + changelog)
        run: scripts/dong-goi-ban-phat-hanh.sh "${TAG#v}"
      - name: Tạo bản phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          thu=""
          if [[ "${TAG}" == *-* ]]; then thu="--prerelease"; fi
          gh release create "${TAG}" dist/onebee-os-*.tar.gz dist/SHA256SUMS --target "${GITHUB_SHA}" \
            --title "OneBee OS ${TAG#v}" --notes-file dist/ghi-chu-phat-hanh.md ${thu}
