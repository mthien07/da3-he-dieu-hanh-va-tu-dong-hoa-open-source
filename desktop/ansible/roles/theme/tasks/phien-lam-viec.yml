---
# Mặc định của phiên làm việc trên Linux Mint: màn hình chào, cập nhật, đồng hồ, nút Bắt đầu, màn hình đăng nhập.
#
# Cập nhật tự động của Mint chạy apt với --force-confnew, nên file của gói trong /etc hoặc /usr mà ta sửa trực tiếp có thể bị ghi đè.
# `dpkg-divert --local --rename` chuyển file của gói sang tên .distrib; bản cập nhật sau của gói cũng được ghi vào tên đó,
# còn tên gốc không còn thuộc gói nào nữa nên không bị đụng tới. Hoàn tác: dpkg-divert --local --rename --remove <đường dẫn>.

- name: Xem file của gói Mint đã được chuyển hướng chưa
  ansible.builtin.command: "dpkg-divert --truename {{ item }}"
  loop:
    - /etc/xdg/autostart/mintwelcome.desktop
    - /etc/xdg/autostart/mintreport.desktop
    - /usr/share/cinnamon/applets/menu@cinnamon.org/settings-override.json
  register: onebee_divert
  changed_when: false

# Chưa chuyển hướng thì --truename in lại đúng đường dẫn gốc; sau lần đầu nó in tên .distrib nên lần chạy sau bỏ qua.
- name: Chuyển hướng file của gói Mint (màn hình chào, báo cáo hệ thống, mặc định nút menu)
  ansible.builtin.command: "dpkg-divert --local --rename --add {{ item.item }}"
  loop: "{{ onebee_divert.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout == item.item
  changed_when: true

# Gói mint-artwork cài settings-override.json của applet menu đặt menu-custom=true, khi đó applet bỏ qua app-menu-icon-name
# và app-menu-label. File gốc đã chuyển hướng sang .distrib ở trên; ghi bản mới = bản của Mint + khóa của OneBee, nên các
# mặc định khác của Mint vẫn giữ. Chỉ có tác dụng với người dùng chưa từng đăng nhập (chưa có file cấu hình applet).
- name: Kiểm tra máy có applet menu của Cinnamon không
  ansible.builtin.stat:
    path: /usr/share/cinnamon/applets/menu@cinnamon.org
  register: onebee_menu_applet

- name: Kiểm tra bản mặc định của Mint cho nút menu (đã chuyển hướng)
  ansible.builtin.stat:
    path: /usr/share/cinnamon/applets/menu@cinnamon.org/settings-override.json.distrib
  register: onebee_menu_goc

- name: Đọc bản mặc định của Mint cho nút menu
  ansible.builtin.slurp:
    src: /usr/share/cinnamon/applets/menu@cinnamon.org/settings-override.json.distrib
  register: onebee_menu_goc_noi_dung
  when: onebee_menu_goc.stat.exists

- name: Nút Bắt đầu — logo OneBee và chữ "Bắt đầu" (giữ các mặc định khác của Mint)
  ansible.builtin.copy:
    dest: /usr/share/cinnamon/applets/menu@cinnamon.org/settings-override.json
    content: >-
      {{
        ((onebee_menu_goc_noi_dung.content | b64decode | from_json) if onebee_menu_goc.stat.exists else {})
        | combine(lookup('ansible.builtin.file', 'menu-settings-override.json') | from_json)
        | to_nice_json
      }}
    owner: root
    group: root
    mode: "0644"
  when: onebee_menu_applet.stat.isdir | default(false)

# Schema com.linuxmint.updates không có trên máy thì glib-compile-schemas bỏ qua. Ẩn lời nhắc không tắt việc cập nhật:
# timer tự nâng cấp chạy bằng root, không phụ thuộc giao diện; biểu tượng "cần khởi động lại" vẫn hiện.
- name: Trình quản lý cập nhật không tự bật cửa sổ, chỉ hiện biểu tượng khi cần
  ansible.builtin.copy:
    dest: /usr/share/glib-2.0/schemas/zz_onebee-updates.gschema.override
    content: |
      # Quản lý bởi OneBee OS — máy đã tự cập nhật; nhân viên không có quyền cài nên không cần cửa sổ và lời nhắc
      [com.linuxmint.updates]
      show-welcome-page=false
      hide-systray=true
      tracker-disable-notifications=true
      default-repo-is-ok=true
    owner: root
    group: root
    mode: "0644"
  notify: Biên dịch lại gsettings schema

# Cinnamon gộp settings-override.json vào mặc định của applet khi người dùng đăng nhập lần đầu; người dùng đã tự chỉnh thì giữ.
- name: Kiểm tra máy có applet lịch của Cinnamon không
  ansible.builtin.stat:
    path: /usr/share/cinnamon/applets/calendar@cinnamon.org
  register: onebee_calendar_applet

- name: Đồng hồ hiện giờ và ngày/tháng/năm
  ansible.builtin.copy:
    src: calendar-settings-override.json
    dest: /usr/share/cinnamon/applets/calendar@cinnamon.org/settings-override.json
    owner: root
    group: root
    mode: "0644"
  when: onebee_calendar_applet.stat.isdir | default(false)
