<!-- Hình nền OneBee: chỉ logo trên nền chuyển sắc một tông. Xuất PNG (đường dẫn đích giữ nguyên):
     rsvg-convert -w 2560 -h 1440 onebee-wallpaper.svg -o onebee-wallpaper.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <radialGradient id="nen" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#16263B"/>
      <stop offset="0.55" stop-color="#0C1626"/>
      <stop offset="1" stop-color="#050A12"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#nen)"/>
  <g transform="translate(1280 720) scale(1.5) translate(-100 -100)">
    <polygon points="100,8 180,54 180,146 100,192 20,146 20,54" fill="#F5A524"/>
    <polygon points="100,30 161,65 161,135 100,170 39,135 39,65" fill="#0A111C"/>
    <path d="M68 78 L96 100 L68 122" stroke="#F5A524" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="104" y="114" width="36" height="12" rx="6" fill="#F5A524"/>
