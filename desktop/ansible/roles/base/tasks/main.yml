---
# Nền tảng: cập nhật danh mục gói, gói cơ bản, ngôn ngữ vi_VN, múi giờ Việt Nam

- name: Cập nhật danh mục gói (tối đa 1 lần/giờ)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Cài gói nền tảng
  ansible.builtin.apt:
    name: "{{ ['locales', 'tzdata'] + onebee_base_packages }}"
    state: present

- name: Kiểm tra các locale đã có
  ansible.builtin.command: locale -a
  register: onebee_locales_available
  changed_when: false

- name: Tạo locale {{ onebee_locale }}
  ansible.builtin.command: "locale-gen {{ onebee_locale }}"
  when: (onebee_locale | lower | replace('-', '')) not in (onebee_locales_available.stdout | lower)
  changed_when: true

- name: Đặt ngôn ngữ mặc định của hệ thống (giữ nguyên các dòng LC_* sẵn có)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG={{ onebee_locale }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Đặt múi giờ {{ onebee_timezone }}
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ onebee_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Ghi tên múi giờ vào /etc/timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ onebee_timezone }}\n"
    owner: root
    group: root
    mode: "0644"

# Chủ trương: nhân viên không có sudo (một số lỗi leo quyền / lộ khóa trong rà soát bảo mật chỉ chặn được khi đúng như vậy).
# Chỉ cảnh báo, không tự gỡ quyền của ai (tài khoản mẫu tạo lúc cài Mint mặc định có sudo).
- name: Liệt kê tài khoản có quyền sudo
  ansible.builtin.shell: |
    set -o pipefail
    getent group sudo admin | cut -d: -f4 | tr ',' '\n' | grep -v -e '^$' -e '^root$' | sort -u || true
  args:
    executable: /bin/bash
  register: onebee_sudo_users
  changed_when: false

- name: Cảnh báo tài khoản có quyền sudo ngoài danh sách quản trị
  ansible.builtin.debug:
    msg: >-
      CẢNH BÁO: các tài khoản có quyền sudo: {{ onebee_sudo_users.stdout_lines | join(', ') }}.
      {{ ('Ngoài danh sách onebee_tai_khoan_quan_tri: '
          ~ (onebee_sudo_users.stdout_lines | difference(onebee_tai_khoan_quan_tri) | join(', ')))
         if onebee_tai_khoan_quan_tri | length > 0 else 'Chỉ tài khoản quản trị máy nên có sudo.' }}
      Nhân viên dùng tài khoản thường: sudo deluser <tên> sudo (làm trên tài khoản quản trị).
  when: >-
    (onebee_tai_khoan_quan_tri | length > 0 and (onebee_sudo_users.stdout_lines | difference(onebee_tai_khoan_quan_tri) | length > 0))
    or (onebee_tai_khoan_quan_tri | length == 0 and onebee_sudo_users.stdout_lines | length > 1)

- name: Ghi phiên bản OneBee OS
  ansible.builtin.copy:
    dest: /etc/onebee-release
    content: |
      ONEBEE_VERSION={{ onebee_version }}
      ONEBEE_EDITION=desktop
    owner: root
    group: root
    mode: "0644"
