<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  OneBee OS: font Caladea (thay cho Cambria) KHÔNG có đủ ký tự tiếng Việt (đã kiểm: thiếu ạ, ử, ỗ, ư, ơ, đ, ệ...).
  Nếu để mặc định, chữ có dấu trong đoạn Cambria bị lẫn sang font khác → nhìn lộn xộn.
  → Thay Cambria bằng Noto Serif (đủ tiếng Việt, cùng kiểu có chân). Bố cục có thể lệch nhẹ so với bản gốc.
  Tên 29- để chạy TRƯỚC 30-metric-aliases.conf (nơi ánh xạ Cambria → Caladea).
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif</string></edit>
  </match>
</fontconfig>
