---
# Tên engine IBus theo từng bộ gõ. Phần tử đầu là bộ gõ lúc đăng nhập: tiếng Việt trước, Super + Space để sang tiếng Anh.
onebee_ibus_engines:
  bamboo: "['Bamboo', 'BambooUs']"
  unikey: "['Unikey', 'xkb:us::eng']"
# Cinnamon 6.6 (Mint 22.3) lấy danh sách bộ gõ từ org.cinnamon.desktop.input-sources thay cho preload-engines
onebee_ibus_sources:
  bamboo: "[('ibus', 'Bamboo'), ('ibus', 'BambooUs')]"
  unikey: "[('ibus', 'Unikey'), ('xkb', 'us')]"

# Firefox: ô mật khẩu (type=password) dùng ngữ cảnh nhập đơn giản của GTK, phím gõ không qua IBus → Telex không thêm dấu vào mật khẩu.
# ibus-bamboo không phân biệt ô mật khẩu (SetContentType bỏ trống) nên phải chặn từ phía Firefox. Firefox chỉ đọc khóa này lúc khởi động;
# file .js đặt trong /usr/lib/firefox/defaults/pref không được nạp → đặt bằng chính sách doanh nghiệp (khóa intl.* được phép).
onebee_firefox_chinh_sach_o_mat_khau:
  policies:
    Preferences:
      intl.ime.use_simple_context_on_password_field:
        Value: true
        Status: locked
