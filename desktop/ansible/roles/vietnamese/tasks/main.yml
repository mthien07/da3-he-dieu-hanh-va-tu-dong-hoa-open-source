---
# Tiếng Việt: gói ngôn ngữ cho hệ thống/ứng dụng + bộ gõ tiếng Việt mặc định

- name: Cài gói ngôn ngữ tiếng Việt
  ansible.builtin.apt:
    name:
      - language-pack-vi
      - language-pack-gnome-vi
      - firefox-locale-vi
      - libglib2.0-bin  # glib-compile-schemas
    state: present

- name: Kiểm tra Firefox (bản .deb) có trên máy
  ansible.builtin.stat:
    path: /usr/lib/firefox/distribution
  register: onebee_ff_phan_phoi

# Gói tiếng Việt của Firefox (firefox-locale-vi) chỉ nạp được vào ĐÚNG phiên bản Firefox của nó, mà kho chỉ giữ bản mới nhất. Máy cài từ ISO
# còn Firefox cũ → Firefox chạy tiếng Anh tới lần tự cập nhật đầu, và Trợ lý AI (Open WebUI) chọn ngôn ngữ theo trình duyệt ở lần mở đầu
# rồi ghi nhớ luôn tiếng Anh. Nâng Firefox cùng gói tiếng Việt lên bản mới nhất để hai bản khớp nhau ngay khi cài.
- name: Nâng Firefox cùng gói tiếng Việt cho khớp phiên bản
  ansible.builtin.apt:  # noqa: package-latest — cố ý: hai gói phải cùng phiên bản, kho chỉ có bản mới nhất
    name: [firefox, firefox-locale-vi]
    state: latest
    only_upgrade: true
  when: onebee_ff_phan_phoi.stat.isdir | default(false)

- name: Cài bộ gõ ibus-bamboo
  ansible.builtin.include_tasks: ibus-bamboo.yml
  when: onebee_input_method == 'bamboo'

- name: Cài bộ gõ ibus-unikey (dự phòng, kho Ubuntu)
  ansible.builtin.apt:
    name: [ibus, ibus-unikey]
    state: present
  when: onebee_input_method == 'unikey'

- name: Chọn IBus làm khung bộ gõ mặc định
  ansible.builtin.lineinfile:
    path: /etc/default/im-config
    regexp: '^IM_CONFIG_DEFAULT_MODE='
    line: IM_CONFIG_DEFAULT_MODE=ibus

# Thanh bộ gõ IBus đọc khóa gsettings org.freedesktop.ibus.general theo hồ sơ dconf của người dùng,
# nên đặt mặc định bằng gschema override (tên zz_ để nạp sau các override khác).
# Người dùng đã tự chọn bộ gõ trước đó thì giữ lựa chọn của họ.
# Cinnamon 6.6 (Mint 22.3) đọc khóa `sources`, bản cũ hơn đọc `preload-engines`; schema không có trên máy thì bị bỏ qua.
- name: Nạp sẵn bộ gõ tiếng Việt cho người dùng
  ansible.builtin.copy:
    dest: /usr/share/glib-2.0/schemas/zz_onebee-ibus.gschema.override
    content: |
      # Quản lý bởi OneBee OS
      [org.freedesktop.ibus.general]
      preload-engines={{ onebee_ibus_engines[onebee_input_method] }}

      [org.cinnamon.desktop.input-sources]
      sources={{ onebee_ibus_sources[onebee_input_method] }}
    owner: root
    group: root
    mode: "0644"
  notify: Biên dịch lại gsettings schema

# Chính sách Firefox dùng chung của máy nằm ở /usr/lib/firefox/distribution/policies.json (gói firefox của Mint không có file này).
# Khi đã nối Box, /etc/firefox/policies/policies.json (role ket-noi-box) THAY file này nhưng được trộn từ nó → khóa vẫn còn.
# Trộn vào nội dung sẵn có thay vì ghi đè; role này chạy trước ket-noi-box nên lần cài đầu /etc đã có khóa.
- name: Đọc chính sách Firefox dùng chung đang có
  ansible.builtin.slurp:
    src: /usr/lib/firefox/distribution/policies.json
  register: onebee_ff_chinh_sach_cu
  failed_when: false
  when: onebee_ff_phan_phoi.stat.isdir | default(false)

- name: Firefox không cho bộ gõ thêm dấu vào ô mật khẩu
  ansible.builtin.copy:
    dest: /usr/lib/firefox/distribution/policies.json
    content: "{{ onebee_ff_cu | combine(onebee_firefox_chinh_sach_o_mat_khau, recursive=True) | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    onebee_ff_cu: "{{ (onebee_ff_chinh_sach_cu.content | b64decode | from_json) if onebee_ff_chinh_sach_cu.content is defined else {} }}"
  when: onebee_ff_phan_phoi.stat.isdir | default(false)
