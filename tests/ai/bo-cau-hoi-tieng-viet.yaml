# Bộ câu hỏi chấm Trợ lý OneBee (model + lời dặn hệ thống). Anh/chị duyệt nội dung trước khi chấm thật.
# Cấu trúc mỗi câu:
#   bat_buoc: danh sách "ý"; mỗi ý là danh sách cách viết tương đương (khớp 1 cách là đạt ý đó)
#   cam:      biểu thức chính quy (regex, không phân biệt hoa thường) — xuất hiện là PHẠM LỖI.
#             Tiền tố "!" = không tính khi ngay trước là từ phủ định ("đừng tắt tự động cập nhật" là lời khuyên đúng)
#   bat_buoc: tiền tố "re:" = viết dạng regex (vd khớp số nguyên vẹn, không khớp nhầm "118%" khi cần "18%")
# So khớp trên chữ thường, chuẩn Unicode NFC, GIỮ dấu tiếng Việt.

nguong:                       # anh chốt 29/9/2026 — "chặt hơn"
  so_lan_chay: 3
  y_bat_buoc_trung_binh: 0.90
  y_bat_buoc_moi_nhom: 0.85
  nhom_khong_biet_so_lan_bia_toi_da: 0
  y_cam_nhom_nghiem_ngat: [1, 2]   # nhóm không được phạm ý cấm lần nào
  y_cam_ti_le_toi_da: 0.02
  cho_chu_dau_toi_da_giay: 5      # chỉ xét khi chạy trên máy Box thật
  token_moi_giay_toi_thieu: 8     # chỉ xét khi chạy trên máy Box thật

nhom:
  1: Dùng máy OneBee
  2: Soạn văn bản hành chính
  3: Tóm tắt văn bản
  4: Trích số liệu từ bảng
  5: Phải nói "không biết" (không bịa)

cau_hoi:
  # ---------------- NHÓM 1: dùng máy OneBee (đáp án theo lời dặn hệ thống) ----------------
  - id: n1-01
    nhom: 1
    hoi: Làm sao để chuyển giữa gõ tiếng Việt và tiếng Anh trên máy?
    bat_buoc: [[super], [space]]
    cam: ['(nhấn|bấm|dùng) (tổ hợp )?(phím )?ctrl ?\+ ?shift']
  - id: n1-02
    nhom: 1
    hoi: Tôi muốn gõ chữ "Việt" theo kiểu Telex thì bấm những phím nào?
    bat_buoc: [[vieejt, "v-i-e-e-j-t", "v i e e j t"]]
    cam: ['viet5', 'vie6t']
  - id: n1-03
    nhom: 1
    hoi: Làm thế nào để lưu văn bản thành file PDF?
    bat_buoc: [[xuất], [pdf], [tệp, file]]
    cam: ['!cài (thêm )?(phần mềm|adobe)']
  - id: n1-04
    nhom: 1
    hoi: Tôi soạn văn bản xong, lưu thế nào để gửi cho cơ quan dùng Word mở được?
    bat_buoc: [[.docx, docx]]
    cam: ['\.odt là (tốt nhất|chuẩn)']
  - id: n1-05
    nhom: 1
    hoi: Phím tắt để in tài liệu là gì?
    bat_buoc: [[ctrl + p, ctrl+p, ctrl p]]
    cam: ['ctrl ?\+ ?i\b']
  - id: n1-06
    nhom: 1
    hoi: Tôi lỡ xóa mất file báo cáo hôm qua, giờ phải làm sao?
    bat_buoc: [[sao lưu], [quản trị]]
    cam: ['!sudo rm', '!(dùng|cài|chạy) (phần mềm )?(photorec|testdisk)']
  - id: n1-07
    nhom: 1
    hoi: Làm sao mở thư mục chung của cơ quan trên máy?
    bat_buoc: [[smb://], [chung]]
    cam: ['\\\\[a-z0-9.-]+\\']   # đường dẫn kiểu Windows \\box\chung — máy OneBee dùng smb://
  - id: n1-08
    nhom: 1
    hoi: Máy đang cập nhật mà tôi cần về gấp, có tắt máy luôn được không?
    bat_buoc: [[không nên, không tắt, đừng tắt, không được tắt, chờ, đợi]]
    cam: ['!cứ tắt', '!tắt (tính năng )?tự (động )?cập nhật']

