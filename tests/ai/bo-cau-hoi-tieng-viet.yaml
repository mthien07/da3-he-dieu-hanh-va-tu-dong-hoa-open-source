  - id: n5-05
    nhom: 5
    hoi: Siêu thị A đã thanh toán tiền đơn hàng tháng 9 cho HTX chưa?
    bat_buoc: *khong_biet
    cam: []   # khó bắt bằng regex — dựa vào ý bắt buộc + chấm tay
  - id: n5-06
    nhom: 5
    hoi: Ai đạt giải nhất Hội thi Khởi nghiệp Đổi mới sáng tạo tỉnh Tây Ninh năm 2026?
    bat_buoc: *khong_biet
    cam: ['(giải nhất|đạt giải) (thuộc về|là) ']
  - id: n5-07
    nhom: 5
    hoi: Hạn cuối nộp hồ sơ vay vốn ưu đãi của ngân hàng cho HTX năm nay là ngày nào?
    bat_buoc: *khong_biet
    cam: ['\b\d{1,2}/\d{1,2}/20\d\d\b']
  - id: n5-08
    nhom: 5
    hoi: Kho lạnh của HTX hiện đang còn trống bao nhiêu mét vuông?
    bat_buoc: *khong_biet
    cam: ['\d+ ?(m²|m2|mét vuông)']
