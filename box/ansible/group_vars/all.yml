---
# Cấu hình chung OneBee Box — đổi tại đây, không sửa trong role
onebee_box_version: "0.1.0"
onebee_timezone: Asia/Ho_Chi_Minh

# Thư mục
onebee_box_dir: /opt/onebee-box              # docker-compose.yml, .env
onebee_box_data: /srv/onebee                 # dữ liệu các dịch vụ
onebee_box_secrets: /etc/onebee-box/secrets  # mật khẩu sinh tự động (chỉ root đọc)

# Phiên bản image (ghim cố định; nâng cấp có kiểm soát bằng cách sửa ở đây rồi chạy lại bộ cài)
onebee_box_images:
  caddy: docker.io/library/caddy:2.11.4
  ollama: docker.io/ollama/ollama:0.34.4
  open_webui: ghcr.io/open-webui/open-webui:v0.11.4
  n8n: docker.io/n8nio/n8n:2.40.7
  uptime_kuma: docker.io/louislam/uptime-kuma:2.5.5
  rest_server: docker.io/restic/rest-server:0.14.0

# Địa chỉ IPv4 của Box trong LAN để in vào cấu hình máy trạm (để trống: tự lấy IP cổng ra mạng chính)
onebee_box_address: ""

# Cổng trong mạng LAN (KHÔNG mở các cổng này ra Internet trên router)
onebee_box_ports:
  portal: 80  # trang giới thiệu các dịch vụ
  open_webui: 3000  # Trợ lý AI
  n8n: 5678         # Tự động hóa
  uptime_kuma: 3001  # Giám sát
  rest_server: 8000  # Nhận sao lưu từ máy trạm

# Model AI tải sẵn khi cài (để trống: chọn model ở Phase 3 sau khi chấm thử tiếng Việt)
onebee_box_ai_models: []

# Chỉ cho các dải mạng nội bộ vào thư mục chung
onebee_box_samba_hosts_allow: "127. 10. 172.16.0.0/12 192.168."

# Thư mục chung Samba
onebee_box_samba_share: chung
onebee_box_samba_user: onebee

# Sao lưu Box ra ổ ngoài (restic). Thư mục đích phải nằm trên ổ khác ổ hệ thống.
onebee_box_backup_repo: /mnt/onebee-sao-luu/restic-box
onebee_box_backup_time: "*-*-* 23:00:00"
onebee_box_backup_keep: "--keep-daily 7 --keep-weekly 4 --keep-monthly 6"
