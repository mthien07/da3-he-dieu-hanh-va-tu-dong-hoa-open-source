---
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 Dương Minh Thiện, HTX OneBee
# Cấu hình chung OneBee Box — đổi tại đây, không sửa trong role
onebee_box_version: "2.1.0"
onebee_timezone: Asia/Ho_Chi_Minh

# Thư mục
onebee_box_dir: /opt/onebee-box              # docker-compose.yml, .env
onebee_box_data: /srv/onebee                 # dữ liệu các dịch vụ
onebee_box_secrets: /etc/onebee-box/secrets  # mật khẩu sinh tự động (chỉ root đọc)
onebee_box_ssh_dir: /etc/onebee-box/secrets/ssh  # khóa SSH quản trị máy trạm (riêng từng Box, có trong bản sao lưu Box)

# Phiên bản image: ghim theo tag + digest (tag trên registry có thể bị đẩy lại — Docker Hub đã đẩy lại caddy:2.11.4 ngày 23/9/2026).
# Nâng cấp có kiểm soát: sửa cả tag lẫn digest rồi chạy lại bộ cài. Digest là của bản đa kiến trúc (index), lấy ngày 10/10/2026.
# Động cơ quy trình Node-RED (Apache-2.0) thay công cụ fair-code cũ (ADR 0006 QĐ6, ADR 0007).
onebee_box_images:
  caddy: docker.io/library/caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
  ollama: docker.io/ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
  # Node-RED 5.0.9 (Apache-2.0): digest bản đa kiến trúc lấy ngày 16/11/2026
  node_red: docker.io/nodered/node-red:5.0.9@sha256:2ccd38b4066648bd5e17430c50a2f8102c566a82fd4f2fc5c342e61664d6896f
  uptime_kuma: docker.io/louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
  rest_server: docker.io/restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
  # Đăng nhập một lần + cầu nối danh tính (ADR 0006, QĐ1): digest bản đa kiến trúc lấy ngày 14/11/2026
  authelia: docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
  python: docker.io/library/python:3.14.10-slim-trixie@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
  # Dữ liệu cấu trúc (ADR 0006, QĐ1): PostgreSQL 18.7 + pgvector 0.8.7, API tự sinh PostgREST 16.5
  # (digest bản đa kiến trúc lấy ngày 14/11/2026)
  postgres: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
  postgrest: docker.io/postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
  # Kho tệp (ADR 0006, QĐ5): SeaweedFS lưu đối tượng; ClamAV chạy từng lượt. Image ClamAV chính chủ có libclamunrar
  # (giấy phép UnRAR, ngoài OSI) nên role box-kho-tep dựng image cục bộ đã bỏ thư viện đó từ đúng digest dưới đây.
  seaweedfs: docker.io/chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
  clamav: docker.io/clamav/clamav:1.5.4-debian13-slim@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc

# Mã đơn vị — BẮT BUỘC, viết tắt tên khách hàng (vd "hoptacxa-an-phu" → "anphu"): chữ thường không dấu, số, gạch giữa, tối đa 32 ký tự.
# Nằm trong chứng chỉ CA riêng của Box (chỉ được cấp tên <mã>.onebee.internal) nên mỗi khách một mã khác nhau; đổi mã = xoay CA.
onebee_box_ma_don_vi: ""

# Địa chỉ IPv4 TĨNH của Box trong LAN — nên khai (hoặc đặt "giữ IP cố định" cho Box trên router). Trống: lấy IP cổng ra mạng chính
# và cảnh báo. Nằm trong chứng chỉ CA; đổi IP = xoay CA (onebee_box_xoay_ca bên dưới) và đồng bộ lại mọi máy trạm.
onebee_box_dia_chi: ""

# Tên đơn vị hiện trên trang chủ Box (vd "HTX Nông nghiệp An Phú"). Để trống: chỉ hiện "OneBee Box".
onebee_box_ten_don_vi: ""

# Tên Box trong mạng LAN qua mDNS (avahi): máy trong LAN gõ http://<tên>.local thay cho IP — Windows 10+, macOS, iOS, Android,
# Linux Mint tự nhận. Chữ thường không dấu, số, gạch giữa. LAN có 2 Box trùng tên thì Box sau tự thành <tên>-2.local → đặt tên khác.
onebee_box_ten_mdns: onebee

# Kỹ thuật vào Box qua Tailscale bằng tên box.<mã đơn vị>.onebee.internal (máy kỹ thuật thêm dòng /etc/hosts trỏ tới IP Tailscale của Box).
# HTTPS (Pha 4): false = dịch vụ vẫn chạy HTTP như cũ (CA đã tạo, máy trạm nhận CA). Chỉ bật sau khi mọi máy trạm đã đồng bộ CA.
onebee_box_https: false
# Bỏ qua chốt chặn "mọi máy đã cấp phải nhận CA trước" khi bật HTTPS (máy hỏng/bỏ không còn liên lạc được).
# Máy bị bỏ sót mất kết nối tới Box
# cho tới khi chạy: sudo onebee-box dong-bo-may <tên-máy>
onebee_box_https_bo_qua_chot_chan: false

# Đăng nhập một lần (Authelia) cho /api/, /files/, /ai/ và trang giám sát — chỉ khi HTTPS có hiệu lực, chỉ trên tên
# https://box.<mã đơn vị>.onebee.internal/ (máy trạm OneBee tự có dòng /etc/hosts; điện thoại/máy ngoài: bản ghi DNS trên router).
# Năm nhóm CỐ ĐỊNH (luật truy cập dựa vào tên nhóm, không đổi ở đây): nhan_vien (một lớp: mật khẩu),
# ky_thuat, quan_ly, thu_kho và ke_toan (hai lớp: mật khẩu + mã TOTP — xem roles/box-dinh-danh/templates/configuration.yml.j2).
# Quản lý người dùng: sudo onebee-box them-nguoi <tên> <nhóm> | xoa-nguoi <tên> | danh-sach-nguoi
onebee_box_nhom_nguoi_dung: [nhan_vien, ky_thuat, quan_ly, thu_kho, ke_toan]

# Cổng trong mạng LAN (KHÔNG mở các cổng này ra Internet trên router)
onebee_box_ports:
  portal: 80  # trang chủ: tình trạng Box + lối tắt các dịch vụ (http://onebee.local)
  uptime_kuma: 3001  # Giám sát
  rest_server: 8000  # Nhận sao lưu từ máy trạm

# Tường lửa: chỉ các mạng này vào được dịch vụ của Box (các cổng trên + thư mục chung + SSH).
# Để trống: tự lấy mạng của cổng mạng chính (vd 192.168.1.0/24). Nhiều mạng: ["192.168.1.0/24", "192.168.2.0/24"].
# KHÔNG đưa mạng Wi-Fi khách vào. Tắt hẳn (chỉ khi cần dò lỗi): onebee_box_tuong_lua_bat: false
onebee_box_tuong_lua_bat: true
onebee_box_lan_cho_phep: []
# Kỹ thuật vào Box qua Tailscale: địa chỉ Tailscale (100.x.y.z hoặc dải) của MÁY KỸ THUẬT được vào web/SSH/thư mục chung của Box
# (QĐ6, rà soát bảo mật F5). Để trống: mọi kết nối qua tailscale0 bị chặn. Cổng mạng lạ khác (card phụ, wg0, tun0) luôn bị chặn.
# Nên kèm ACL phía Tailscale: tag:kythuat → Box tcp 22,80,443,3001; thiết bị khác trong tailnet không vào được Box.
onebee_box_tailscale_cho_phep: []

# SSH vào Box chỉ bằng khóa, không cho root — tự bật khi đã có khóa SSH của tài khoản quản trị (~/.ssh/authorized_keys)
onebee_box_ssh_chi_khoa: true

# Trợ lý AI — dòng Gemma của Google (anh chốt 29/9). Chọn theo ADR 0003: bản nhẹ nhất vượt ngưỡng chất lượng
# (chấm trên máy thử 29/9). Tốc độ còn phải đo trên máy Box thật.
onebee_box_ai_model: gemma4:e2b-it-qat
# Mô hình nhúng cho kho tri thức (pgvector); đổi mô hình thì lần nạp sau tự nhúng lại toàn bộ
onebee_box_ai_model_nhung: nomic-embed-text:v1.5
onebee_box_ai_models: ["{{ onebee_box_ai_model }}", "{{ onebee_box_ai_model_nhung }}"]   # model tải sẵn khi cài
onebee_box_admin_email: quantri@onebee.lan             # địa chỉ quản trị nhận thư của Box

# Chỉ cho các dải mạng nội bộ vào thư mục chung
onebee_box_samba_hosts_allow: "127. 10. 172.16.0.0/12 192.168."

# Samba chỉ SMB 3.1.1 + bắt buộc mã hóa (Windows 10+, Linux). false khi còn máy Windows 7/8 hoặc thiết bị quét cũ cần nối thư mục chung.
onebee_box_samba_smb3: true

# Thư mục chung Samba
onebee_box_samba_share: chung
onebee_box_samba_user: onebee

# Sao lưu Box hằng đêm (restic, mã hóa).
# false (mặc định): lưu thẳng vào ổ dữ liệu của Box, thư mục <onebee_box_data>/sao-luu/restic-box; bộ cài tự tạo kho, không cần gắn ổ.
#   Giới hạn: bản sao lưu nằm cùng ổ với dữ liệu — chống xóa nhầm, sửa nhầm, lỗi phần mềm, nhưng HỎNG Ổ Box là mất cả hai.
#   Ổ dữ liệu đã dùng trên 90% thì lần sao lưu dừng (không làm đầy ổ khiến CSDL ngừng).
# true: lưu ra ổ ngoài gắn riêng tại thư mục cha của onebee_box_backup_repo (chưa gắn ổ thì không sao lưu).
onebee_box_backup_o_ngoai: false
onebee_box_backup_repo: /mnt/onebee-sao-luu/restic-box   # chỉ dùng khi onebee_box_backup_o_ngoai: true
onebee_box_backup_time: "*-*-* 23:00:00"
onebee_box_backup_keep: "--keep-daily 7 --keep-weekly 4 --keep-monthly 6"

# Email (động cơ quy trình gửi báo cáo, nhắc việc). Để smtp_host trống = chưa cấu hình (quy trình vẫn cài, chưa gửi được).
# Mật khẩu SMTP KHÔNG ghi ở đây: đặt bằng lệnh  sudo onebee-box dat-mat-khau-email  rồi chạy lại bộ cài.
onebee_box_email:
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_ssl: false        # true khi dùng cổng 465
  smtp_starttls: true    # cổng 587
  gui_tu: "OneBee Box <box@onebee.lan>"
  nhan: "quantri@onebee.lan"   # nhiều người nhận: ngăn cách bằng dấu phẩy

# Lịch nhắc hạn nộp — BẢN MẪU, kế toán kiểm lại và sửa theo đơn vị:
#   thuế: Điều 44 Luật Quản lý thuế 38/2019/QH14 (Luật QLT 108/2025/QH15 hiệu lực 1/7/2026 — chưa đối chiếu điều khoản thời hạn)
#   BHXH: Điều 34 khoản 4 điểm a Luật BHXH 2024 — đóng hằng tháng chậm nhất ngày cuối cùng của tháng tiếp theo
# loai: thang | quy (tháng đầu mỗi quý) | nam (kèm thang); ngay: số ngày hoặc cuoi_thang
onebee_box_lich_han:
  - {ten: "Nộp tờ khai thuế tháng trước (đơn vị khai theo tháng)", loai: thang, ngay: 20}
  - {ten: "Đóng BHXH bắt buộc của tháng trước (đơn vị đóng hằng tháng)", loai: thang, ngay: cuoi_thang}
  - {ten: "Nộp tờ khai thuế quý trước (đơn vị khai theo quý)", loai: quy, ngay: cuoi_thang}
  - {ten: "Nộp hồ sơ quyết toán thuế năm trước", loai: nam, thang: 3, ngay: cuoi_thang}
  - {ten: "Gửi báo cáo tình hình hoạt động quý cho xã viên (việc nội bộ — ví dụ)", loai: quy, ngay: 15}
onebee_box_nhac_truoc_ngay: [7, 3, 1, 0]

# Trợ lý AI theo từng nhân viên: mỗi người dùng khóa riêng do `onebee-box them-nguoi` cấp (dán vào máy bằng `hoi --dan-khoa`).
# true (chuyển tiếp): Box vẫn cấp thêm khóa theo từng MÁY (may-<tên>) để `hoi` chạy ngay ở nhân viên chưa có khóa riêng.
#   Khóa máy nằm trong /etc/onebee-hoi.conf, mọi tài khoản trên máy đọc được (rà soát bảo mật F10).
# false: thôi cấp khóa theo máy, thôi đẩy HOI_API_KEY xuống máy. Sau đó chạy: sudo onebee-box go-khoa-hoi-may
#   — nhân viên nào chưa có khóa riêng sẽ không hỏi được nữa.
onebee_box_hoi_khoa_may: true

# Khóa gửi tình trạng dùng chung (header X-OneBee-Key ở cửa động cơ quy trình) — chỉ còn là bộ lọc rác, không phải danh tính máy
# (danh tính = chữ ký HMAC, Pha 2).
# true (chuyển tiếp): vẫn đòi khóa này và đẩy dòng TINH_TRANG_KEY xuống máy — cần khi còn máy chạy bản desktop cũ
#   (bản cũ không báo tình trạng nếu thiếu khóa).
# false: động cơ quy trình không đòi khóa, Box thôi tạo/đẩy khóa. Chỉ đặt false khi MỌI máy đã chạy lại bộ cài desktop bản mới.
onebee_box_khoa_tinh_trang_chung: true

# Xoay CA (đổi mã đơn vị hoặc IP của Box, hoặc nghi lộ khóa CA): đặt true MỘT LẦN cùng lúc đổi
# onebee_box_ma_don_vi / onebee_box_dia_chi, chạy bộ cài, rồi đặt lại false.
# CA cũ được cất ở /etc/onebee-box/secrets/ca.cu-<ngày giờ>. Bộ cài KHÔNG tự đẩy CA mới xuống máy trạm: chạy tiếp
# 'sudo onebee-box dong-bo-may --tat-ca' (đẩy cả IP mới lẫn CA mới; máy đang tắt: chạy lại cho máy đó khi bật).
onebee_box_xoay_ca: false

# Bản chạy thử công khai (demo): bật để bộ cài nạp dữ liệu giả lập, tạo tài khoản mẫu bằng onebee-box them-nguoi
# và bật lịch đặt lại dữ liệu lúc 03:00 mỗi ngày; thanh thông báo demo hiện trên trang Sổ điều hành.
# Tắt (mặc định): không nạp dữ liệu mẫu, gỡ dịch vụ và bộ hẹn giờ đặt lại. Chỉ dùng cho Box công khai, không dùng
# cho Box thật của đơn vị. Mật khẩu tài khoản mẫu do them-nguoi sinh một lần, lưu trên Box, không nằm trong kho mã.
onebee_box_che_do_demo: false
