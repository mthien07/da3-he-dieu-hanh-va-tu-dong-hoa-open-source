---
# Cấu hình chung OneBee Box — đổi tại đây, không sửa trong role
onebee_box_version: "1.0.0-rc.1"
onebee_timezone: Asia/Ho_Chi_Minh

# Thư mục
onebee_box_dir: /opt/onebee-box              # docker-compose.yml, .env
onebee_box_data: /srv/onebee                 # dữ liệu các dịch vụ
onebee_box_secrets: /etc/onebee-box/secrets  # mật khẩu sinh tự động (chỉ root đọc)
onebee_box_ssh_dir: /etc/onebee-box/secrets/ssh  # khóa SSH quản trị máy trạm (riêng từng Box, có trong bản sao lưu Box)

# Phiên bản image: ghim theo tag + digest (tag trên registry có thể bị đẩy lại — Docker Hub đã đẩy lại caddy:2.11.4 ngày 23/9/2026).
# Nâng cấp có kiểm soát: sửa cả tag lẫn digest rồi chạy lại bộ cài. Digest là của bản đa kiến trúc (index), lấy ngày 10/10/2026.
# n8n: bản 2.40.x đã ngừng nhận bản vá (bản cuối 2.40.7) — dòng 2.42.x trở đi mới còn được vá (docs/security-audit.md, F1).
onebee_box_images:
  caddy: docker.io/library/caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
  ollama: docker.io/ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
  open_webui: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
  n8n: docker.io/n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
  uptime_kuma: docker.io/louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
  rest_server: docker.io/restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5

# Mã đơn vị — BẮT BUỘC, viết tắt tên khách hàng (vd "hoptacxa-an-phu" → "anphu"): chữ thường không dấu, số, gạch giữa, tối đa 32 ký tự.
# Nằm trong chứng chỉ CA riêng của Box (chỉ được cấp tên <mã>.onebee.internal) nên mỗi khách một mã khác nhau; đổi mã = xoay CA.
onebee_box_ma_don_vi: ""

# Địa chỉ IPv4 TĨNH của Box trong LAN — nên khai (hoặc đặt "giữ IP cố định" cho Box trên router). Trống: lấy IP cổng ra mạng chính
# và cảnh báo. Nằm trong chứng chỉ CA; đổi IP = xoay CA (onebee-box doi-ca) và đồng bộ lại mọi máy trạm.
onebee_box_dia_chi: ""

# Kỹ thuật vào Box qua Tailscale bằng tên box.<mã đơn vị>.onebee.internal (máy kỹ thuật thêm dòng /etc/hosts trỏ tới IP Tailscale của Box).
# HTTPS (Pha 4): false = dịch vụ vẫn chạy HTTP như cũ (CA đã tạo, máy trạm nhận CA). Chỉ bật sau khi mọi máy trạm đã đồng bộ CA.
onebee_box_https: false
# Bỏ qua chốt chặn "mọi máy đã cấp phải nhận CA trước" khi bật HTTPS (máy hỏng/bỏ không còn liên lạc được).
# Máy bị bỏ sót mất kết nối tới Box
# cho tới khi chạy: sudo onebee-box dong-bo-may <tên-máy>
onebee_box_https_bo_qua_chot_chan: false

# Cổng trong mạng LAN (KHÔNG mở các cổng này ra Internet trên router)
onebee_box_ports:
  portal: 80  # trang giới thiệu các dịch vụ
  open_webui: 3000  # Trợ lý AI
  n8n: 5678         # Tự động hóa
  uptime_kuma: 3001  # Giám sát
  rest_server: 8000  # Nhận sao lưu từ máy trạm

# Tường lửa: chỉ các mạng này vào được dịch vụ của Box (các cổng trên + thư mục chung + SSH).
# Để trống: tự lấy mạng của cổng mạng chính (vd 192.168.1.0/24). Nhiều mạng: ["192.168.1.0/24", "192.168.2.0/24"].
# KHÔNG đưa mạng Wi-Fi khách vào. Tắt hẳn (chỉ khi cần dò lỗi): onebee_box_tuong_lua_bat: false
onebee_box_tuong_lua_bat: true
onebee_box_lan_cho_phep: []
# Kỹ thuật vào Box qua Tailscale: địa chỉ Tailscale (100.x.y.z hoặc dải) của MÁY KỸ THUẬT được vào web/SSH/thư mục chung của Box
# (QĐ6, rà soát bảo mật F5). Để trống: mọi kết nối qua tailscale0 bị chặn. Cổng mạng lạ khác (card phụ, wg0, tun0) luôn bị chặn.
# Nên kèm ACL phía Tailscale: tag:kythuat → Box tcp 22,80,443,3000,5678,3001; thiết bị khác trong tailnet không vào được Box.
onebee_box_tailscale_cho_phep: []

# SSH vào Box chỉ bằng khóa, không cho root — tự bật khi đã có khóa SSH của tài khoản quản trị (~/.ssh/authorized_keys)
onebee_box_ssh_chi_khoa: true

# Trợ lý AI — dòng Gemma của Google (anh chốt 29/9). Chọn theo ADR 0003: bản nhẹ nhất vượt ngưỡng chất lượng
# (chấm trên máy thử 29/9). Tốc độ còn phải đo trên máy Box thật.
onebee_box_ai_model: gemma4:e2b-it-qat
onebee_box_ai_models: ["{{ onebee_box_ai_model }}"]   # model tải sẵn khi cài
onebee_box_admin_email: quantri@onebee.lan             # tài khoản quản trị Trợ lý AI (mật khẩu: onebee-box in-khoa)

# Chỉ cho các dải mạng nội bộ vào thư mục chung
onebee_box_samba_hosts_allow: "127. 10. 172.16.0.0/12 192.168."

# Samba chỉ SMB 3.1.1 + bắt buộc mã hóa (Windows 10+, Linux). false khi còn máy Windows 7/8 hoặc thiết bị quét cũ cần nối thư mục chung.
onebee_box_samba_smb3: true

# Thư mục chung Samba
onebee_box_samba_share: chung
onebee_box_samba_user: onebee

# Sao lưu Box ra ổ ngoài (restic). Thư mục đích phải nằm trên ổ khác ổ hệ thống.
onebee_box_backup_repo: /mnt/onebee-sao-luu/restic-box
onebee_box_backup_time: "*-*-* 23:00:00"
onebee_box_backup_keep: "--keep-daily 7 --keep-weekly 4 --keep-monthly 6"

# Email (n8n gửi báo cáo, nhắc việc). Để smtp_host trống = chưa cấu hình (quy trình vẫn cài, chưa gửi được).
# Mật khẩu SMTP KHÔNG ghi ở đây: đặt bằng lệnh  sudo onebee-box dat-mat-khau-email  rồi chạy lại bộ cài.
onebee_box_email:
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_ssl: false        # true khi dùng cổng 465
  smtp_starttls: true    # cổng 587
  gui_tu: "OneBee Box <box@onebee.lan>"
  nhan: "quantri@onebee.lan"   # nhiều người nhận: ngăn cách bằng dấu phẩy

# Lịch nhắc hạn nộp — BẢN MẪU, kế toán kiểm lại và sửa theo đơn vị:
#   thuế: Điều 44 Luật Quản lý thuế 38/2019/QH14 (Luật QLT 108/2025/QH15 hiệu lực 1/7/2026 — chưa đối chiếu điều khoản thời hạn)
#   BHXH: Điều 34 khoản 4 điểm a Luật BHXH 2024 — đóng hằng tháng chậm nhất ngày cuối cùng của tháng tiếp theo
# loai: thang | quy (tháng đầu mỗi quý) | nam (kèm thang); ngay: số ngày hoặc cuoi_thang
onebee_box_lich_han:
  - {ten: "Nộp tờ khai thuế tháng trước (đơn vị khai theo tháng)", loai: thang, ngay: 20}
  - {ten: "Đóng BHXH bắt buộc của tháng trước (đơn vị đóng hằng tháng)", loai: thang, ngay: cuoi_thang}
  - {ten: "Nộp tờ khai thuế quý trước (đơn vị khai theo quý)", loai: quy, ngay: cuoi_thang}
  - {ten: "Nộp hồ sơ quyết toán thuế năm trước", loai: nam, thang: 3, ngay: cuoi_thang}
  - {ten: "Gửi báo cáo tình hình hoạt động quý cho xã viên (việc nội bộ — ví dụ)", loai: quy, ngay: 15}
onebee_box_nhac_truoc_ngay: [7, 3, 1, 0]

# Trợ lý AI theo từng nhân viên (Pha 4c): mỗi nhân viên dùng khóa riêng của mình (lệnh `hoi --dang-nhap` / `hoi --dan-khoa`).
# true (chuyển tiếp): Box vẫn cấp tài khoản + khóa theo từng MÁY (may-<tên>@onebee.lan)
#   để `hoi` chạy ngay ở nhân viên chưa thiết lập khóa riêng.
#   Khóa máy nằm trong /etc/onebee-hoi.conf, mọi tài khoản trên máy đọc được (rà soát bảo mật F10).
# false: thôi cấp tài khoản/khóa theo máy, thôi đẩy HOI_API_KEY xuống máy. Sau đó chạy: sudo onebee-box go-khoa-hoi-may
#   (xóa các tài khoản may-<tên> cũ trên Open WebUI) — nhân viên nào chưa chạy `hoi --dang-nhap` sẽ không hỏi được nữa.
onebee_box_hoi_khoa_may: true

# Khóa gửi tình trạng dùng chung (header X-OneBee-Key ở cửa n8n) — chỉ còn là bộ lọc rác, không phải danh tính máy
# (danh tính = chữ ký HMAC, Pha 2).
# true (chuyển tiếp): vẫn đòi khóa này và đẩy dòng TINH_TRANG_KEY xuống máy — cần khi còn máy chạy bản desktop cũ
#   (bản cũ không báo tình trạng nếu thiếu khóa).
# false: n8n không đòi khóa, Box thôi tạo/đẩy khóa. Chỉ đặt false khi MỌI máy đã chạy lại bộ cài desktop bản mới.
onebee_box_khoa_tinh_trang_chung: true
