---
# Trợ lý AI của OneBee Box: cài mã dịch vụ, lời dặn, kho mẫu soạn văn bản và kho tri thức, chạy dịch vụ sau khi đã chép đủ tệp,
# rồi nạp tri thức vào PostgreSQL. Dịch vụ khai trong docker-compose.yml của box-stack nhưng role này mới chạy nó
# (giống box-dinh-danh: thiếu tệp gắn vào container thì Docker tạo thư mục rỗng đúng chỗ đó).

# Dữ liệu của dịch vụ cũ không còn dùng: đổi tên để giữ làm dấu (không xóa dữ liệu của đơn vị), rồi dọn tệp bí mật cũ
- name: Kiểm tra dữ liệu dịch vụ cũ còn trên ổ
  ansible.builtin.stat:
    path: "{{ onebee_box_data }}/{{ 'open' ~ '-webui' }}"
  register: onebee_ai_du_lieu_cu

- name: Đổi tên dữ liệu dịch vụ cũ (giữ nguyên, không xóa)
  ansible.builtin.command: >-
    mv {{ onebee_box_data }}/{{ 'open' ~ '-webui' }}
    {{ onebee_box_data }}/{{ 'open' ~ '-webui' }}.da-thay-{{ ansible_facts.date_time.date }}
  when: onebee_ai_du_lieu_cu.stat.exists
  changed_when: true

- name: Dọn tệp bí mật của dịch vụ cũ (không còn ai đọc)
  ansible.builtin.file:
    path: "{{ onebee_box_secrets }}/{{ item }}"
    state: absent
  loop: [webui-admin-password, webui-secret-key]

- name: Tạo thư mục mã dịch vụ, dữ liệu và kho tri thức của đơn vị
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ onebee_box_dir }}/ai-rag", mode: "0755"}
    - {path: "{{ onebee_box_data }}/ai-rag", mode: "0700"}
    - {path: "{{ onebee_box_data }}/knowledge", mode: "0755"}

- name: Cài mã dịch vụ Trợ lý AI và lời dặn
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ onebee_box_dir }}/ai-rag/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: onebee-ai-rag.py, dest: onebee-ai-rag.py, mode: "0644"}
    - {src: tro-ly-onebee-loi-dan.md, dest: tro-ly-onebee-loi-dan.md, mode: "0644"}
  register: onebee_ai_ma

- name: Cài kho mẫu soạn văn bản và kho tri thức gốc
  ansible.builtin.copy:
    # "/" cuối: chép nội dung thư mục vào đúng chỗ onebee-ai-rag.py đọc (thiếu thì thành prompts/prompts/*.json)
    src: "{{ item.src }}/"
    dest: "{{ onebee_box_dir }}/ai-rag/{{ item.dest }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  loop:
    - {src: prompts, dest: prompts}
    - {src: knowledge, dest: knowledge}

- name: Cài mã dịch vụ cho lệnh cấp / thu hồi khóa trên Box
  ansible.builtin.copy:
    src: onebee-ai-rag.py
    dest: /usr/local/lib/onebee-box/onebee-ai-rag.py
    owner: root
    group: root
    mode: "0750"

- name: Kiểm tra model AI đã tải
  ansible.builtin.command: docker exec onebee-ollama ollama list
  register: onebee_ollama_list
  changed_when: false

- name: Tải model AI (lần đầu có thể mất vài phút)
  ansible.builtin.command: "docker exec onebee-ollama ollama pull {{ item }}"
  loop: "{{ onebee_box_ai_models }}"
  when: item not in onebee_ollama_list.stdout
  changed_when: true
  register: onebee_ollama_pull
  # Model vài GB; mạng chập chờn → thử lại (Ollama giữ phần đã tải)
  retries: 5
  delay: 30
  until: onebee_ollama_pull.rc == 0

# Chép tệp xong mới chạy dịch vụ: container gắn thư mục mã, thiếu tệp thì Python thoát ngay
- name: Khởi chạy / cập nhật dịch vụ Trợ lý AI
  ansible.builtin.command: >-
    docker compose up -d --no-deps
    {{ '--force-recreate' if onebee_ai_ma is changed else '' }}
    ai-rag
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_ai_up
  changed_when: onebee_ai_up.stderr is search('Creat|Recreat|Start|Pull')
  retries: 5
  delay: 30
  until: onebee_ai_up.rc == 0

- name: Chờ dịch vụ Trợ lý AI sẵn sàng
  ansible.builtin.command: >-
    docker exec onebee-ai-rag python3 -I -c
    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/suc-khoe', timeout=5)"
  register: onebee_ai_san_sang
  until: onebee_ai_san_sang.rc == 0
  retries: 30
  delay: 2
  changed_when: false

# Nạp lại cập nhật đúng dòng (nguồn, đoạn) và xóa đoạn thừa; chạy lại không tạo bản trùng
- name: Nạp kho tri thức vào PostgreSQL
  ansible.builtin.command: /usr/local/sbin/onebee-box nap-tri-thuc
  register: onebee_ai_nap
  changed_when: false
  failed_when: onebee_ai_nap.rc not in [0, 3]   # 3 = mô hình nhúng chưa có → cảnh báo, không chặn phần còn lại

- name: Cảnh báo chưa nạp được kho tri thức (các phần khác vẫn cài tiếp)
  ansible.builtin.debug:
    msg: "{{ onebee_ai_nap.stderr }}"
  when: onebee_ai_nap.rc == 3
