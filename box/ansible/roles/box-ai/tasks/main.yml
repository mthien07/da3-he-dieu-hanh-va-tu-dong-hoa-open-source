---
# Trợ lý AI: tải model Gemma, cài dịch vụ RAG nhẹ trên lõi (MIT), nạp lời dặn, mẫu prompt và tri thức

- name: Cài lời dặn và dịch vụ Trợ lý AI & RAG
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/lib/onebee-box/{{ item.src }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: tro-ly-onebee-loi-dan.md, mode: "0644"}
    - {src: goi-y.json, mode: "0644"}
    - {src: onebee-ai-rag.py, mode: "0750"}

- name: Xóa tệp dịch vụ AI cũ không còn dùng
  ansible.builtin.file:
    path: "/usr/local/lib/onebee-box/{{ item }}"
    state: absent
  loop:
    - "{{ 'onebee-web' ~ 'ui.py' }}"
    - giao-dien-tieng-viet.json

- name: Cài đặt kho mẫu prompt hành chính và tri thức RAG
  ansible.builtin.copy:
    # "/" cuối: chép nội dung thư mục vào đúng chỗ onebee-ai-rag.py đọc (thiếu thì thành prompts/prompts/*.json)
    src: "{{ item.src }}/"
    dest: "/usr/local/lib/onebee-box/{{ item.dest }}/"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: prompts, dest: prompts}
    - {src: knowledge, dest: knowledge}

- name: Tạo thư mục tri thức công cộng cho đơn vị bổ sung tài liệu
  ansible.builtin.file:
    path: /usr/local/share/onebee-box/knowledge
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Kiểm tra model AI đã tải
  ansible.builtin.command: docker exec onebee-ollama ollama list
  register: onebee_ollama_list
  changed_when: false

- name: Tải model AI (lần đầu có thể mất vài phút)
  ansible.builtin.command: "docker exec onebee-ollama ollama pull {{ item }}"
  loop: "{{ onebee_box_ai_models }}"
  when: item not in onebee_ollama_list.stdout
  changed_when: true
  register: onebee_ollama_pull
  # Model vài GB; mạng chập chờn → thử lại (Ollama giữ phần đã tải)
  retries: 5
  delay: 30
  until: onebee_ollama_pull.rc == 0

- name: Tạo / cập nhật cấu hình Trợ lý OneBee
  ansible.builtin.command: /usr/local/sbin/onebee-box dong-bo-tro-ly
  register: onebee_tro_ly
  changed_when: onebee_tro_ly.stdout is search('đã tạo|đã cập nhật')
  retries: 12
  delay: 10
  until: onebee_tro_ly.rc != 1
  failed_when: onebee_tro_ly.rc not in [0, 3]

- name: Đồng bộ mẫu prompt hành chính và kho tri thức RAG
  ansible.builtin.command: "/usr/local/sbin/onebee-box {{ item }}"
  loop:
    - dong-bo-prompts
    - dong-bo-tri-thuc
  register: onebee_ai_rag_sync
  changed_when: onebee_ai_rag_sync.stdout is search('đã tạo|đã cập nhật|đã đồng bộ')
