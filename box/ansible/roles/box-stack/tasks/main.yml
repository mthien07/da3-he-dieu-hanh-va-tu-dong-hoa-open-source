---
# Bộ dịch vụ OneBee Box chạy bằng Docker Compose

# Mã đơn vị, IP, CA riêng — trước mọi thứ khác (chốt onebee_box_ip cho cấu hình sinh bên dưới)
- name: Mã đơn vị, địa chỉ IP và CA riêng của Box
  ansible.builtin.include_tasks: ca.yml

# Mỗi Origin thêm phải dạng http(s)://tên[:cổng], không đường dẫn/khoảng trắng/";" ("*" bị loại) — ";" là dấu ngăn của CORS_ALLOW_ORIGIN
- name: Kiểm tra onebee_box_cors_them (danh sách Origin Trợ lý AI khai thêm)
  ansible.builtin.assert:
    that:
      - onebee_box_cors_them is sequence
      - onebee_box_cors_them is not string
      - >-
        onebee_box_cors_them | map('string')
        | select('match', '^https?://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$') | list | length
        == onebee_box_cors_them | length
    fail_msg: >-
      onebee_box_cors_them trong box/ansible/group_vars/all.yml phải là danh sách Origin dạng http://tên:cổng hoặc https://tên:cổng
      (không đường dẫn, không dấu "/" ở cuối, không "*"), vd ["http://onebee-box.lan:3000"].
    quiet: true

- name: Tạo thư mục cài đặt và dữ liệu
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ onebee_box_dir }}", mode: "0750"}
    - {path: "{{ onebee_box_dir }}/portal"}
    - {path: "{{ onebee_box_dir }}/portal/caddy"}
    - {path: "{{ onebee_box_dir }}/portal/site"}
    - {path: "{{ onebee_box_dir }}/portal/site-http"}
    - {path: "{{ onebee_box_data }}/caddy", mode: "0700"}
    - {path: "{{ onebee_box_data }}/caddy/data", mode: "0700"}
    - {path: "{{ onebee_box_data }}/caddy/config", mode: "0700"}
    - {path: "{{ onebee_box_data }}"}
    - {path: "{{ onebee_box_data }}/ollama", mode: "0700"}
    - {path: "{{ onebee_box_data }}/open-webui", mode: "0700"}
    - {path: "{{ onebee_box_data }}/node-red", owner: "1000", mode: "0700"}  # Node-RED chạy bằng uid 1000
    - {path: "{{ onebee_box_data }}/tinh-trang-may", owner: "1000", mode: "0700"}  # máy trạm báo tình trạng (qua Node-RED)
    - {path: "{{ onebee_box_data }}/ho-tro", owner: "1000", mode: "0700"}  # sổ yêu cầu hỗ trợ + khảo sát (qua Node-RED)
    - {path: "{{ onebee_box_data }}/uptime-kuma", mode: "0700"}
    - {path: "{{ onebee_box_data }}/restic", mode: "0700"}

# Danh sách máy đã cấp cho quy-trinh đọc (chỉ đọc): root ghi, nhóm 1000 đọc. Nội dung do onebee-box dong-bo-ten-may dựng từ bí mật
- name: Tạo thư mục danh sách máy đã cấp (quy-trinh chỉ đọc)
  ansible.builtin.file:
    path: "{{ onebee_box_data }}/may-da-cap"
    state: directory
    owner: root
    group: "1000"
    mode: "0750"

- name: Tạo file tài khoản kho sao lưu (rest-server) nếu chưa có
  ansible.builtin.copy:
    dest: "{{ onebee_box_data }}/restic/.htpasswd"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0600"

- name: Sinh file .env chứa khóa bí mật
  ansible.builtin.template:
    src: env.j2
    dest: "{{ onebee_box_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Kiểm tra giám sát đã có tài khoản quản trị chưa
  ansible.builtin.stat:
    path: "{{ onebee_box_secrets }}/uptime-kuma-da-co-quan-tri"
  register: onebee_kuma_xong

# Chưa có tài khoản quản trị: cổng Uptime Kuma chỉ mở trong Box (127.0.0.1) → không ai trong LAN giành được trang
# "tạo tài khoản đầu tiên" lúc mới cài; tạo xong mới mở ra LAN (bước "Mở giám sát ra mạng LAN" bên dưới)
- name: Chọn địa chỉ mở cổng giám sát
  ansible.builtin.set_fact:
    onebee_kuma_dia_chi: "{{ '0.0.0.0' if onebee_kuma_xong.stat.exists else '127.0.0.1' }}"

- name: Kiểm tra đã có docker-compose.yml của lần cài trước chưa
  ansible.builtin.stat:
    path: "{{ onebee_box_dir }}/docker-compose.yml"
  register: onebee_compose_cu

# Lệnh onebee-box cài TRƯỚC khi sinh cấu hình dịch vụ: bước quyết định HTTPS (https.yml) gọi "onebee-box may-chua-nhan-ca"
- name: Cài lệnh quản trị onebee-box
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: onebee-box-common.sh.j2, dest: /usr/local/lib/onebee-box/common.sh, mode: "0640"}
    - {src: onebee-box-sao-luu.sh.j2, dest: /usr/local/lib/onebee-box/sao-luu.sh, mode: "0640"}
    - {src: onebee-box-chan-doan.sh.j2, dest: /usr/local/lib/onebee-box/chan-doan.sh, mode: "0640"}
    - {src: onebee-canh-bao.sh.j2, dest: /usr/local/bin/onebee-canh-bao, mode: "0755"}
    - {src: onebee-box.sh.j2, dest: /usr/local/sbin/onebee-box, mode: "0750"}

# Đường dẫn bộ cài: onebee-box xoay-khoa --box chạy lại bộ cài để áp dụng mật khẩu mới
- name: Ghi đường dẫn bộ cài OneBee Box
  ansible.builtin.copy:
    content: "{{ (playbook_dir ~ '/../onebee-box-install.sh') | realpath }}\n"
    dest: /usr/local/lib/onebee-box/duong-dan-bo-cai
    owner: root
    group: root
    mode: "0640"

# Bật HTTPS hay giữ HTTP (chốt chặn: mọi máy đã cấp phải nhận CA trước) → onebee_https_hieu_luc, onebee_https_doi
- name: Quyết định bật HTTPS
  ansible.builtin.include_tasks: https.yml

# Trang chủ dựng cẩm nang và lối vào mẫu soạn văn bản từ 2 file dữ liệu dùng chung với máy trạm và Trợ lý AI
- name: Đọc nguồn chung cẩm nang và gợi ý của Trợ lý cho trang chủ
  ansible.builtin.set_fact:
    onebee_cam_nang: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../desktop/ansible/roles/theme/files/onebee-cam-nang.json')
         | from_json }}
    onebee_goi_y: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/roles/box-ai/files/goi-y.json') | from_json }}
    # Thứ tự và tên 4 nhóm phím tắt trên trang chủ (mã nhóm khớp trường "nhom" của cẩm nang)
    onebee_cam_nang_nhom:
      - {ma: go-tieng-viet, ten: "Gõ tiếng Việt"}
      - {ma: man-hinh, ten: "Màn hình và cửa sổ"}
      - {ma: chup, ten: "Chụp màn hình"}
      - {ma: soan-thao, ten: "Soạn thảo"}

- name: Sinh cấu hình dịch vụ
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ onebee_box_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: docker-compose.yml.j2, dest: docker-compose.yml}
    - {src: index.html.j2, dest: portal/site/index.html}
    - {src: huong-dan-ca.html.j2, dest: portal/site-http/index.html}

- name: Sinh cấu hình cổng Caddy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ onebee_box_dir }}/portal/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: onebee_caddyfile

# Chứng chỉ gốc CA là công khai (khóa gốc thì không): máy trạm/thiết bị khác tải về từ http://<IP>/onebee-ca.crt rồi ĐỐI CHIẾU VÂN TAY
# qua kênh ngoài (bản in khóa, màn hình Box: sudo onebee-box in-ca) — vân tay không hiện trên trang HTTP nào
- name: Phục vụ chứng chỉ gốc CA (trang giới thiệu HTTP + trang hướng dẫn cài CA)
  ansible.builtin.copy:
    src: "{{ onebee_box_secrets }}/ca/root.crt"
    remote_src: true
    dest: "{{ onebee_box_dir }}/portal/{{ item }}/onebee-ca.crt"
    owner: root
    group: root
    mode: "0644"
  loop: [site, site-http]

# Ô "Tình trạng hệ thống" của trang chủ đọc /trang-thai.json — tệp tĩnh do lịch trên Box ghi mỗi phút (không mở thêm API nào)
- name: Tạo thư mục trạng thái của Box (kết quả sao lưu lần cuối)
  ansible.builtin.file:
    path: /var/lib/onebee-box
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cài công cụ số liệu tình trạng cho trang chủ
  ansible.builtin.copy:
    src: onebee-trang-thai-web.py
    dest: /usr/local/lib/onebee-box/onebee-trang-thai-web.py
    owner: root
    group: root
    mode: "0750"

- name: Cài lịch cập nhật số liệu tình trạng (systemd)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - onebee-trang-thai-web.service
    - onebee-trang-thai-web.timer

- name: Bật lịch cập nhật số liệu tình trạng mỗi phút
  ansible.builtin.systemd_service:
    name: onebee-trang-thai-web.timer
    enabled: true
    state: started
    daemon_reload: true

# Máy đã cấp từ trước (Box nâng cấp) được ghi vào danh sách; Box mới chưa có máy nào thì không đổi gì
- name: Đồng bộ danh sách máy đã cấp cho quy-trinh (Node-RED)
  ansible.builtin.command: /usr/local/sbin/onebee-box dong-bo-ten-may
  register: onebee_ten_may
  changed_when: onebee_ten_may.stdout is search('đã đổi')

# Chuyển HTTP ↔ HTTPS đổi chủ các cổng 3000/5678/3001/8000 (backend ↔ Caddy): dừng các dịch vụ giữ cổng trước,
# kẻo "port is already allocated".
# Chỉ làm khi trạng thái HTTPS thật sự đổi (dừng vài chục giây). Image không đổi nên không tải lại gì.
- name: Chuyển HTTP ↔ HTTPS — dừng các dịch vụ đang giữ cổng
  ansible.builtin.command: docker compose stop portal open-webui quy-trinh uptime-kuma rest-server
  args:
    chdir: "{{ onebee_box_dir }}"
  when: onebee_https_doi | bool and onebee_compose_cu.stat.exists
  changed_when: true

# Dịch vụ backend trước, cổng Caddy (portal) sau: không tranh cổng khi chuyển, và Caddy khởi động khi backend đã có
- name: Khởi chạy / cập nhật dịch vụ backend
  ansible.builtin.command: docker compose up -d --remove-orphans --no-deps ollama open-webui quy-trinh uptime-kuma rest-server
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_compose_up_be
  changed_when: onebee_compose_up_be.stderr is search('Creat|Recreat|Start|Pull')
  # Lần đầu phải tải hơn 10 GB image; mạng chập chờn (gặp thật khi thử 8/10: EOF, DNS lỗi, TLS quá giờ) → thử lại,
  # phần đã tải được giữ. Image đã có sẵn thì không cần mạng.
  retries: 5
  delay: 30
  until: onebee_compose_up_be.rc == 0

- name: Khởi chạy / cập nhật cổng Caddy (portal)
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_compose_up
  changed_when: onebee_compose_up.stderr is search('Creat|Recreat|Start|Pull')
  retries: 5
  delay: 30
  until: onebee_compose_up.rc == 0

# CA đổi (xoay CA, gia hạn trung gian): chứng chỉ đã cấp cho từng cổng ký bằng CA cũ → xóa để Caddy cấp lại bằng CA mới, rồi nạp lại
- name: CA đổi — xóa chứng chỉ cũ của Caddy và khởi động lại cổng
  ansible.builtin.shell: >-
    rm -rf {{ onebee_box_data }}/caddy/data/caddy/certificates && docker restart onebee-portal
  when: (onebee_ca is changed or onebee_https_doi | bool) and (onebee_https_hieu_luc | bool)
  changed_when: true

# Caddyfile đổi mà container không bị tạo lại (compose giữ nguyên) → nạp lại cấu hình, không đứt kết nối đang có
- name: Nạp lại cấu hình Caddy
  ansible.builtin.command: docker exec onebee-portal caddy reload --config /etc/caddy/Caddyfile --force
  when: onebee_caddyfile is changed and not ((onebee_ca is changed or onebee_https_doi | bool) and (onebee_https_hieu_luc | bool))
  register: onebee_caddy_reload
  retries: 5
  delay: 3
  until: onebee_caddy_reload.rc == 0
  changed_when: true

# Các cổng web (chạy lại nhiều lần an toàn). HTTP: gọi thẳng cổng backend trên 127.0.0.1.
# HTTPS: qua Caddy bằng https://<IP>:<cổng> (Box tin CA riêng);
# kiểm cả NỘI DUNG vì Caddy trả 200 rỗng khi Host không khớp site nào
- name: Chờ các dịch vụ web sẵn sàng (HTTP)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}/"
    status_code: [200, 302, 401]
  register: onebee_http
  until: onebee_http.status in [200, 302, 401]
  retries: 120   # đủ thời gian cho dịch vụ khởi động trên thiết bị yếu
  delay: 5
  loop:
    - "{{ onebee_box_ports.portal }}"
    - "{{ onebee_box_ports.open_webui }}"
    - "{{ onebee_box_ports.quy_trinh }}"
    - "{{ onebee_box_ports.uptime_kuma }}"
  when: not (onebee_https_hieu_luc | bool)

- name: Chờ các dịch vụ web sẵn sàng (HTTPS qua Caddy)
  ansible.builtin.uri:
    url: "https://{{ onebee_box_ip }}{{ item.cong }}{{ item.duong_dan | default('/') }}"
    status_code: [200, 302, 401]
    return_content: true
  register: onebee_https
  until: onebee_https.status in [200, 302, 401] and (item.noi_dung in onebee_https.content)
  retries: 120
  delay: 5
  loop:
    - {cong: "", noi_dung: "OneBee Box"}
    - {cong: ":{{ onebee_box_ports.open_webui }}", noi_dung: "Open WebUI"}
    - {cong: ":{{ onebee_box_ports.quy_trinh }}", duong_dan: "/healthz", noi_dung: "ok"}
  loop_control:
    label: "{{ item.cong }}"
  when: onebee_https_hieu_luc | bool

# Uptime Kuma: chưa có tài khoản quản trị thì Caddy chưa mở cổng 3001 → kiểm bên trong container; có rồi thì kiểm qua Caddy
- name: Chờ Uptime Kuma sẵn sàng (HTTPS, kiểm trong container khi chưa mở cổng 3001)
  ansible.builtin.command: >-
    docker exec onebee-uptime-kuma node -e
    "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
  register: onebee_kuma_san_sang
  until: onebee_kuma_san_sang.rc == 0
  retries: 120
  delay: 5
  changed_when: false
  when: (onebee_https_hieu_luc | bool) and not onebee_kuma_xong.stat.exists

- name: Chờ Uptime Kuma sẵn sàng (HTTPS qua Caddy)
  ansible.builtin.uri:
    url: "https://{{ onebee_box_ip }}:{{ onebee_box_ports.uptime_kuma }}/"
    status_code: [200, 302, 401]
    return_content: true
  register: onebee_kuma_https
  until: onebee_kuma_https.status in [200, 302, 401] and ('Uptime Kuma' in onebee_kuma_https.content)
  retries: 120
  delay: 5
  when: (onebee_https_hieu_luc | bool) and onebee_kuma_xong.stat.exists

# Dịch vụ đã chuyển xong → ghi/xóa dấu HTTPS (các lệnh onebee-box, kể cả "dong-bo-tro-ly" ở role sau, từ đây gọi theo chế độ mới)
- name: Ghi nhận trạng thái HTTPS
  ansible.builtin.include_tasks: https-dau.yml

# Giám sát: tạo sẵn tài khoản quản trị Uptime Kuma (không còn "ai mở trước thành quản trị"), danh sách theo dõi
# các dịch vụ của Box, email báo khi dịch vụ ngừng (khi đã cấu hình email)
- name: Cài công cụ cấu hình Uptime Kuma
  ansible.builtin.copy:
    src: onebee-kuma.js
    dest: /usr/local/lib/onebee-box/onebee-kuma.js
    owner: root
    group: root
    mode: "0640"

- name: Chuẩn bị tài khoản quản trị giám sát
  ansible.builtin.set_fact:
    onebee_kuma_password: "{{ lookup('ansible.builtin.password', onebee_box_secrets ~ '/uptime-kuma-password',
                              chars=['ascii_letters', 'digits'], length=24) }}"
    onebee_kuma_smtp_pw: "{{ lookup('ansible.builtin.file', onebee_box_secrets ~ '/smtp-password', errors='ignore') | default('', true) }}"
  no_log: true

- name: Cấu hình Uptime Kuma (tài khoản, theo dõi dịch vụ, email báo)
  ansible.builtin.shell: >-
    set -o pipefail;
    docker exec -i -w /app -e KUMA_USER -e KUMA_PASS -e KUMA_MONITORS -e KUMA_SMTP -e KUMA_TRUST_PROXY onebee-uptime-kuma
    node - < /usr/local/lib/onebee-box/onebee-kuma.js
  args:
    executable: /bin/bash
  environment:
    KUMA_USER: quantri
    KUMA_PASS: "{{ onebee_kuma_password }}"
    KUMA_MONITORS: "{{ onebee_kuma_monitors | to_json }}"
    KUMA_SMTP: "{{ (onebee_kuma_smtp | to_json) if onebee_box_email.smtp_host else '' }}"
    KUMA_TRUST_PROXY: "{{ '1' if (onebee_https_hieu_luc | bool) else '0' }}"
  vars:
    # Theo dõi nội bộ luôn gọi http://<dịch vụ> trong mạng Docker (không phụ thuộc HTTPS); khi bật HTTPS thêm theo dõi cổng Caddy
    # (ignoreTls: trong container Kuma tên "portal" không khớp chứng chỉ của IP Box — chỉ kiểm Caddy còn trả lời)
    onebee_kuma_monitors: "{{ onebee_kuma_monitors_goc + (onebee_kuma_monitor_https if (onebee_https_hieu_luc | bool) else []) }}"
    onebee_kuma_monitor_https:
      - {name: "Cổng HTTPS (Caddy)", url: "https://portal:443/", ignoreTls: true}
    onebee_kuma_monitors_goc:
      - {name: "Trang giới thiệu", url: "http://portal/"}
      - {name: "Trợ lý AI (Open WebUI)", url: "http://open-webui:8080/health"}
      - {name: "AI chạy tại chỗ (Ollama)", url: "http://ollama:11434/"}
      - {name: "Tự động hóa (Node-RED)", url: "http://quy-trinh:1880/healthz"}
      - {name: "Kho sao lưu máy trạm", url: "http://rest-server:8000/", accepted_statuscodes: ["401"]}
    onebee_kuma_smtp:
      smtpHost: "{{ onebee_box_email.smtp_host }}"
      smtpPort: "{{ onebee_box_email.smtp_port | int }}"
      smtpSecure: "{{ onebee_box_email.smtp_ssl | bool }}"
      smtpIgnoreTLSError: false
      smtpUsername: "{{ onebee_box_email.smtp_user }}"
      smtpPassword: "{{ onebee_kuma_smtp_pw }}"
      smtpFrom: "{{ onebee_box_email.gui_tu }}"
      smtpTo: "{{ onebee_box_email.nhan }}"
  register: onebee_kuma
  changed_when: onebee_kuma.stdout is search('đã tạo|đã cập nhật')
  retries: 12
  delay: 10
  until: onebee_kuma.rc != 1          # 1 = Uptime Kuma chưa sẵn sàng → thử lại
  failed_when: onebee_kuma.rc not in [0, 3]
  no_log: true

- name: Ghi nhận giám sát đã có tài khoản quản trị
  ansible.builtin.copy:
    dest: "{{ onebee_box_secrets }}/uptime-kuma-da-co-quan-tri"
    content: "1\n"
    owner: root
    group: root
    mode: "0600"
  when: onebee_kuma.rc == 0
  register: onebee_kuma_ghi

- name: Mở giám sát ra mạng LAN (sau khi đã có tài khoản quản trị)
  when: onebee_kuma.rc == 0 and onebee_kuma_ghi is changed
  block:
    - name: Mở cổng giám sát cho mạng LAN
      ansible.builtin.set_fact:
        onebee_kuma_dia_chi: 0.0.0.0

    - name: Sinh lại cấu hình dịch vụ và cổng Caddy với cổng giám sát mở ra LAN
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ onebee_box_dir }}/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: docker-compose.yml.j2, dest: docker-compose.yml}
        - {src: Caddyfile.j2, dest: portal/caddy/Caddyfile}

    # HTTP: giám sát tự công bố cổng 3001. HTTPS: Caddy mới công bố cổng 3001 (và có site cho nó) → tạo lại cổng
    - name: Khởi động lại giám sát / cổng Caddy với cổng mới
      ansible.builtin.command: docker compose up -d uptime-kuma portal
      args:
        chdir: "{{ onebee_box_dir }}"
      changed_when: true

- name: Báo kết quả cấu hình giám sát
  ansible.builtin.debug:
    msg: "{{ onebee_kuma.stdout_lines | default([]) }}"
