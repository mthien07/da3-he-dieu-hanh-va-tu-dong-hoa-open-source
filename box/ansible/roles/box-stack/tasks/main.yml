---
# Bộ dịch vụ OneBee Box chạy bằng Docker Compose

- name: Tạo thư mục cài đặt và dữ liệu
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: "{{ onebee_box_dir }}", mode: "0750"}
    - {path: "{{ onebee_box_dir }}/portal"}
    - {path: "{{ onebee_box_dir }}/portal/site"}
    - {path: "{{ onebee_box_data }}"}
    - {path: "{{ onebee_box_data }}/ollama", mode: "0700"}
    - {path: "{{ onebee_box_data }}/open-webui", mode: "0700"}
    - {path: "{{ onebee_box_data }}/n8n", owner: "1000", mode: "0700"}  # n8n chạy bằng uid 1000
    - {path: "{{ onebee_box_data }}/tinh-trang-may", owner: "1000", mode: "0700"}  # máy trạm báo tình trạng (qua n8n)
    - {path: "{{ onebee_box_data }}/ho-tro", owner: "1000", mode: "0700"}  # sổ yêu cầu hỗ trợ + khảo sát (qua n8n)
    - {path: "{{ onebee_box_data }}/uptime-kuma", mode: "0700"}
    - {path: "{{ onebee_box_data }}/restic", mode: "0700"}
    - {path: "{{ onebee_box_dir }}/n8n-import", owner: "1000", mode: "0700"}
    - {path: "{{ onebee_box_dir }}/n8n-import/workflows", owner: "1000", mode: "0700"}

# Danh sách máy đã cấp cho n8n đọc (chỉ đọc): root ghi, nhóm 1000 (n8n) đọc. Nội dung do onebee-box dong-bo-ten-may dựng từ bí mật
- name: Tạo thư mục danh sách máy đã cấp (n8n chỉ đọc)
  ansible.builtin.file:
    path: "{{ onebee_box_data }}/may-da-cap"
    state: directory
    owner: root
    group: "1000"
    mode: "0750"

- name: Tạo file tài khoản kho sao lưu (rest-server) nếu chưa có
  ansible.builtin.copy:
    dest: "{{ onebee_box_data }}/restic/.htpasswd"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0600"

- name: Sinh mật khẩu chủ n8n (lần đầu)
  ansible.builtin.set_fact:
    onebee_n8n_owner_password: "{{ lookup('ansible.builtin.password', onebee_box_secrets ~ '/n8n-owner-password',
                                   chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true

- name: Băm mật khẩu chủ n8n bằng bcrypt (lưu 1 lần để .env không đổi mỗi lần chạy)
  ansible.builtin.shell: >-
    set -o pipefail;
    htpasswd -niBC 10 onebee < {{ onebee_box_secrets }}/n8n-owner-password | cut -d: -f2 | tr -d '\n'
    > {{ onebee_box_secrets }}/n8n-owner-hash && chmod 600 {{ onebee_box_secrets }}/n8n-owner-hash
  args:
    creates: "{{ onebee_box_secrets }}/n8n-owner-hash"
    executable: /bin/bash

- name: Sinh file .env chứa khóa bí mật
  ansible.builtin.template:
    src: env.j2
    dest: "{{ onebee_box_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Kiểm tra giám sát đã có tài khoản quản trị chưa
  ansible.builtin.stat:
    path: "{{ onebee_box_secrets }}/uptime-kuma-da-co-quan-tri"
  register: onebee_kuma_xong

# Chưa có tài khoản quản trị: cổng Uptime Kuma chỉ mở trong Box (127.0.0.1) → không ai trong LAN giành được trang
# "tạo tài khoản đầu tiên" lúc mới cài; tạo xong mới mở ra LAN (bước "Mở giám sát ra mạng LAN" bên dưới)
- name: Chọn địa chỉ mở cổng giám sát
  ansible.builtin.set_fact:
    onebee_kuma_dia_chi: "{{ '0.0.0.0' if onebee_kuma_xong.stat.exists else '127.0.0.1' }}"

# Nâng cấp n8n chạy migration CSDL SQLite lúc khởi động, không quay lui được → chép nguyên thư mục dữ liệu n8n trước khi
# đổi image (lúc n8n đã dừng). Hoàn tác: dừng n8n, trả thư mục chép về chỗ cũ, ghim lại image cũ, chạy lại bộ cài.
# Chép vào thư mục .tmp rồi đổi tên: chép dở (ổ đầy, mất điện) không bị coi là bản chép hoàn chỉnh. Tên có dấu thời gian: mỗi lần
# đổi image có một bản riêng. Không xóa tự động — xóa tay sau khi đã dùng ổn: sudo rm -rf /srv/onebee/n8n.truoc-*
- name: Kiểm tra đã có docker-compose.yml của lần cài trước chưa
  ansible.builtin.stat:
    path: "{{ onebee_box_dir }}/docker-compose.yml"
  register: onebee_compose_cu

- name: Đọc docker-compose.yml của lần cài trước
  ansible.builtin.slurp:
    src: "{{ onebee_box_dir }}/docker-compose.yml"
  register: onebee_compose_cu_nd
  when: onebee_compose_cu.stat.exists

# regex_findall (không phải regex_search): trả danh sách rỗng khi không khớp, chạy giống nhau trên ansible-core 2.16 (Ubuntu 24.04) và 2.19.
# Mẫu không dùng dấu gạch chéo ngược (2.16 và 2.19 xử lý chuỗi thoát trong Jinja khác nhau)
- name: Xác định image n8n đang dùng và image sắp đổi sang
  ansible.builtin.set_fact:
    onebee_n8n_anh_cu: >-
      {{ ((onebee_compose_cu_nd.content | b64decode) | regex_findall('image: ([A-Za-z0-9._/:@-]*n8nio/n8n[A-Za-z0-9._:@-]*)')
         | first | default('')) if onebee_compose_cu.stat.exists else '' }}
    onebee_n8n_ban_sao: >-
      {{ onebee_box_data }}/n8n.truoc-{{ ((onebee_compose_cu_nd.content | b64decode)
         | regex_findall('n8nio/n8n:([A-Za-z0-9._-]+)') | first | default('khong-ro'))
         if onebee_compose_cu.stat.exists else 'khong-ro' }}-{{ ansible_facts.date_time.iso8601_basic_short }}

- name: Chép dữ liệu n8n trước khi đổi image
  when:
    - onebee_n8n_anh_cu | length > 0
    - onebee_n8n_anh_cu != onebee_box_images.n8n
  block:
    # Đủ chỗ trống? (ổ đầy cũng làm hỏng ghi SQLite của Open WebUI, Uptime Kuma và thư mục chung Samba) — kiểm TRƯỚC khi dừng n8n
    - name: Đo dung lượng dữ liệu n8n và chỗ trống trên ổ dữ liệu
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(du -sk {{ onebee_box_data }}/n8n | cut -f1) $(df --output=avail -k {{ onebee_box_data }} | tail -n 1 | tr -d ' ')"
      args:
        executable: /bin/bash
      register: onebee_n8n_dung_luong
      changed_when: false

    - name: Dừng bộ cài nếu ổ không đủ chỗ cho bản chép (n8n chưa bị dừng)
      ansible.builtin.assert:
        that: (onebee_n8n_dung_luong.stdout.split()[1] | int) > (onebee_n8n_dung_luong.stdout.split()[0] | int) * 2 + 1048576
        fail_msg: >-
          Không đủ chỗ để chép dữ liệu n8n trước khi nâng cấp (dữ liệu {{ onebee_n8n_dung_luong.stdout.split()[0] }} KB,
          còn trống {{ onebee_n8n_dung_luong.stdout.split()[1] }} KB; cần ít nhất gấp đôi + 1 GB). Dọn ổ rồi chạy lại bộ cài.
        quiet: true

    - name: Chép dữ liệu n8n (dừng n8n để chép nhất quán; lỗi giữa chừng thì xóa bản dở và bật lại n8n)
      block:
        - name: Dừng n8n
          ansible.builtin.command: docker compose stop n8n
          args:
            chdir: "{{ onebee_box_dir }}"
          changed_when: true

        # Đảm bảo n8n thật sự đã dừng (không chép SQLite đang mở, có WAL)
        - name: Kiểm tra n8n không còn chạy
          ansible.builtin.command: docker compose ps --status running -q n8n
          args:
            chdir: "{{ onebee_box_dir }}"
          register: onebee_n8n_dang_chay
          changed_when: false
          failed_when: onebee_n8n_dang_chay.stdout | length > 0

        - name: Xóa thư mục tạm của lần chép dở trước (nếu có)
          ansible.builtin.file:
            path: "{{ onebee_n8n_ban_sao }}.tmp"
            state: absent

        - name: Chép thư mục dữ liệu n8n sang thư mục tạm (giữ nguyên chủ sở hữu và quyền)
          ansible.builtin.command: "cp -a {{ onebee_box_data }}/n8n {{ onebee_n8n_ban_sao }}.tmp"
          changed_when: true

        - name: Đổi tên thành bản chép chính thức
          ansible.builtin.command: "mv {{ onebee_n8n_ban_sao }}.tmp {{ onebee_n8n_ban_sao }}"
          args:
            creates: "{{ onebee_n8n_ban_sao }}"

        - name: Báo đã chép
          ansible.builtin.debug:
            msg: >-
              Đã chép dữ liệu n8n sang {{ onebee_n8n_ban_sao }} trước khi đổi {{ onebee_n8n_anh_cu }} → {{ onebee_box_images.n8n }}.
              Xóa tay khi đã dùng ổn: sudo rm -rf {{ onebee_box_data }}/n8n.truoc-*
      rescue:
        - name: Xóa bản chép dở
          ansible.builtin.file:
            path: "{{ onebee_n8n_ban_sao }}.tmp"
            state: absent

        - name: Bật lại n8n (đừng để dịch vụ dừng vì bộ cài lỗi)
          ansible.builtin.command: docker compose start n8n
          args:
            chdir: "{{ onebee_box_dir }}"
          changed_when: true
          failed_when: false

        - name: Dừng bộ cài, chưa đổi image
          ansible.builtin.fail:
            msg: >-
              Không chép được dữ liệu n8n trước khi nâng cấp (n8n đã được bật lại, image CHƯA đổi). Kiểm tra ổ đĩa
              ({{ onebee_box_data }}) rồi chạy lại bộ cài.

- name: Sinh cấu hình dịch vụ
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ onebee_box_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: docker-compose.yml.j2, dest: docker-compose.yml}
    - {src: Caddyfile.j2, dest: portal/Caddyfile}
    - {src: index.html.j2, dest: portal/site/index.html}

- name: Tạo thư mục thư viện lệnh onebee-box
  ansible.builtin.file:
    path: /usr/local/lib/onebee-box
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Cài lệnh quản trị onebee-box
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: onebee-box-common.sh.j2, dest: /usr/local/lib/onebee-box/common.sh, mode: "0640"}
    - {src: onebee-box-sao-luu.sh.j2, dest: /usr/local/lib/onebee-box/sao-luu.sh, mode: "0640"}
    - {src: onebee-box.sh.j2, dest: /usr/local/sbin/onebee-box, mode: "0750"}

# Máy đã cấp từ trước (Box nâng cấp) được ghi vào danh sách; Box mới chưa có máy nào thì không đổi gì
- name: Đồng bộ danh sách máy đã cấp cho n8n
  ansible.builtin.command: /usr/local/sbin/onebee-box dong-bo-ten-may
  register: onebee_ten_may
  changed_when: onebee_ten_may.stdout is search('đã đổi')

- name: Khởi chạy / cập nhật các dịch vụ
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_compose_up
  changed_when: onebee_compose_up.stderr is search('Creat|Recreat|Start|Pull')
  # Lần đầu phải tải hơn 10 GB image; mạng chập chờn (gặp thật khi thử 8/10: EOF, DNS lỗi, TLS quá giờ) → thử lại,
  # phần đã tải được giữ. Image đã có sẵn thì không cần mạng.
  retries: 5
  delay: 30
  until: onebee_compose_up.rc == 0

- name: Chờ các dịch vụ web sẵn sàng
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}/"
    status_code: [200, 302, 401]
  register: onebee_http
  until: onebee_http.status in [200, 302, 401]
  retries: 120   # n8n lần đầu sau khi nâng cấp chạy migration CSDL — có thể lâu hơn 5 phút
  delay: 5
  loop:
    - "{{ onebee_box_ports.portal }}"
    - "{{ onebee_box_ports.open_webui }}"
    - "{{ onebee_box_ports.n8n }}"
    - "{{ onebee_box_ports.uptime_kuma }}"

# Giám sát: tạo sẵn tài khoản quản trị Uptime Kuma (không còn "ai mở trước thành quản trị"), danh sách theo dõi
# các dịch vụ của Box, email báo khi dịch vụ ngừng (khi đã cấu hình email)
- name: Cài công cụ cấu hình Uptime Kuma
  ansible.builtin.copy:
    src: onebee-kuma.js
    dest: /usr/local/lib/onebee-box/onebee-kuma.js
    owner: root
    group: root
    mode: "0640"

- name: Chuẩn bị tài khoản quản trị giám sát
  ansible.builtin.set_fact:
    onebee_kuma_password: "{{ lookup('ansible.builtin.password', onebee_box_secrets ~ '/uptime-kuma-password',
                              chars=['ascii_letters', 'digits'], length=24) }}"
    onebee_kuma_smtp_pw: "{{ lookup('ansible.builtin.file', onebee_box_secrets ~ '/smtp-password', errors='ignore') | default('', true) }}"
  no_log: true

- name: Cấu hình Uptime Kuma (tài khoản, theo dõi dịch vụ, email báo)
  ansible.builtin.shell: >-
    set -o pipefail;
    docker exec -i -w /app -e KUMA_USER -e KUMA_PASS -e KUMA_MONITORS -e KUMA_SMTP onebee-uptime-kuma
    node - < /usr/local/lib/onebee-box/onebee-kuma.js
  args:
    executable: /bin/bash
  environment:
    KUMA_USER: quantri
    KUMA_PASS: "{{ onebee_kuma_password }}"
    KUMA_MONITORS: "{{ onebee_kuma_monitors | to_json }}"
    KUMA_SMTP: "{{ (onebee_kuma_smtp | to_json) if onebee_box_email.smtp_host else '' }}"
  vars:
    onebee_kuma_monitors:
      - {name: "Trang giới thiệu", url: "http://portal/"}
      - {name: "Trợ lý AI (Open WebUI)", url: "http://open-webui:8080/health"}
      - {name: "AI chạy tại chỗ (Ollama)", url: "http://ollama:11434/"}
      - {name: "Tự động hóa (n8n)", url: "http://n8n:5678/healthz"}
      - {name: "Kho sao lưu máy trạm", url: "http://rest-server:8000/", accepted_statuscodes: ["401"]}
    onebee_kuma_smtp:
      smtpHost: "{{ onebee_box_email.smtp_host }}"
      smtpPort: "{{ onebee_box_email.smtp_port | int }}"
      smtpSecure: "{{ onebee_box_email.smtp_ssl | bool }}"
      smtpIgnoreTLSError: false
      smtpUsername: "{{ onebee_box_email.smtp_user }}"
      smtpPassword: "{{ onebee_kuma_smtp_pw }}"
      smtpFrom: "{{ onebee_box_email.gui_tu }}"
      smtpTo: "{{ onebee_box_email.nhan }}"
  register: onebee_kuma
  changed_when: onebee_kuma.stdout is search('đã tạo|đã cập nhật')
  retries: 12
  delay: 10
  until: onebee_kuma.rc != 1          # 1 = Uptime Kuma chưa sẵn sàng → thử lại
  failed_when: onebee_kuma.rc not in [0, 3]
  no_log: true

- name: Ghi nhận giám sát đã có tài khoản quản trị
  ansible.builtin.copy:
    dest: "{{ onebee_box_secrets }}/uptime-kuma-da-co-quan-tri"
    content: "1\n"
    owner: root
    group: root
    mode: "0600"
  when: onebee_kuma.rc == 0
  register: onebee_kuma_ghi

- name: Mở giám sát ra mạng LAN (sau khi đã có tài khoản quản trị)
  when: onebee_kuma.rc == 0 and onebee_kuma_ghi is changed
  block:
    - name: Mở cổng giám sát cho mạng LAN
      ansible.builtin.set_fact:
        onebee_kuma_dia_chi: 0.0.0.0

    - name: Sinh lại cấu hình dịch vụ với cổng giám sát mở ra LAN
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ onebee_box_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Khởi động lại giám sát với cổng mới
      ansible.builtin.command: docker compose up -d uptime-kuma
      args:
        chdir: "{{ onebee_box_dir }}"
      changed_when: true

- name: Báo kết quả cấu hình giám sát
  ansible.builtin.debug:
    msg: "{{ onebee_kuma.stdout_lines | default([]) }}"
