---
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 Dương Minh Thiện, HTX OneBee
# Kho tệp của OneBee Box (ADR 0006, QĐ5): SeaweedFS lưu đối tượng đã kiểm dịch; ClamAV quét từng lượt, không có clamd thường trú.
# Dịch vụ khai trong docker-compose.yml của box-stack; role này dựng image ClamAV cục bộ (bỏ libclamunrar), tạo thư mục,
# cài mã dịch vụ rồi mới chạy SeaweedFS và cổng tệp (box-stack không tự chạy: thiếu tệp/chữ ký thì dịch vụ lỗi ngay).

- name: Tạo thư mục dữ liệu kho tệp, chữ ký ClamAV và cấu hình dịch vụ cổng tệp
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    # freshclam trong image tự hạ xuống user clamav (UID 1000) nên thư mục chữ ký thuộc UID đó;
    # clamscan của kho tệp đọc chữ ký qua mount chỉ đọc trong container
    - {path: "{{ onebee_box_data }}/clamav", mode: "0755", owner: "1000", group: "1000"}
    - {path: "{{ onebee_box_data }}/kho-tep", mode: "0700"}
    - {path: "{{ onebee_box_data }}/kho-tep/cho-quet", mode: "0700"}
    - {path: "{{ onebee_box_data }}/kho-tep/cach-ly", mode: "0700"}
    - {path: "{{ onebee_box_dir }}/kho-tep", mode: "0755"}
    - {path: "{{ onebee_box_dir }}/clamav", mode: "0755"}

# SeaweedFS chạy bằng uid 1000 trong container, không capability (compose user: "1000:1000"): thư mục dữ liệu phải thuộc uid đó
- name: Giao thư mục dữ liệu SeaweedFS cho người dùng trong container
  ansible.builtin.file:
    path: "{{ onebee_box_data }}/seaweedfs"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Cài mã dịch vụ kho tệp (mount vào container và lệnh nộp chữ ký ngoại tuyến)
  ansible.builtin.copy:
    src: onebee-kho-tep.py
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ onebee_box_dir }}/kho-tep/onebee-kho-tep.py"
    - /usr/local/lib/onebee-box/onebee-kho-tep.py
  register: onebee_kho_tep_ma

- name: Cài Dockerfile image kiểm dịch ClamAV
  ansible.builtin.copy:
    src: clamav-khong-unrar.Dockerfile
    dest: "{{ onebee_box_dir }}/clamav/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: onebee_clamav_dockerfile

- name: Kiểm image kiểm dịch ClamAV cục bộ đã có chưa
  ansible.builtin.command: docker image inspect onebee/clamav-khong-unrar:1.5.4
  register: onebee_clamav_image
  changed_when: false
  failed_when: false

# Dựng lại chỉ khi Dockerfile đổi hoặc image chưa có — chạy lại bộ cài không tải/dựng lại image
- name: Dựng image kiểm dịch ClamAV cục bộ (bỏ libclamunrar)
  ansible.builtin.command: docker build --tag onebee/clamav-khong-unrar:1.5.4 {{ onebee_box_dir }}/clamav
  when: onebee_clamav_dockerfile is changed or onebee_clamav_image.rc != 0
  register: onebee_clamav_dung
  changed_when: true
  retries: 5   # lần đầu phải tải image chính chủ + gói python3 (mạng chập chờn)
  delay: 30
  until: onebee_clamav_dung.rc == 0

# ADR 0006 QĐ5: image chính chủ (còn libclamunrar, giấy phép UnRAR) chỉ cần lúc dựng — xóa sau khi dựng để Box
# không giữ lại image có thư viện ngoài OSI. Image chạy là image cục bộ đã dồn lớp, không phụ thuộc image gốc.
- name: Xóa image ClamAV chính chủ sau khi dựng image cục bộ
  ansible.builtin.command: docker image rm {{ onebee_box_images.clamav }}
  changed_when: false   # image đã xóa từ lần trước thì lệnh báo không có ảnh — không phải thay đổi cấu hình
  failed_when: false

- name: Kiểm chữ ký ClamAV đã có trên Box chưa
  ansible.builtin.find:
    paths: "{{ onebee_box_data }}/clamav"
    patterns: ["*.cvd", "*.cld"]
    file_type: file
  register: onebee_clamav_chu_ky

# Thư mục chữ ký trên Box che thư mục cùng tên trong image: image ClamAV chính chủ có sẵn bộ chữ ký thì chép ra trước
# (Box không cần Internet lúc cài). Không có thì bước sau tải từ Internet hoặc nộp ngoại tuyến.
- name: Chép bộ chữ ký ClamAV có sẵn trong image cục bộ (nếu có)
  ansible.builtin.command: >-
    docker run --rm -v {{ onebee_box_data }}/clamav:/seed
    --entrypoint sh onebee/clamav-khong-unrar:1.5.4 -c 'cp -an /var/lib/clamav/. /seed/ 2>/dev/null || true; chmod 755 /seed'
  when: onebee_clamav_chu_ky.matched == 0
  changed_when: false

- name: Kiểm lại chữ ký ClamAV sau khi chép từ image
  ansible.builtin.find:
    paths: "{{ onebee_box_data }}/clamav"
    patterns: ["*.cvd", "*.cld"]
    file_type: file
  register: onebee_clamav_chu_ky_sau

# Box có Internet: tải lần đầu. Không có mạng: không làm hỏng bộ cài; nộp ngoại tuyến bằng lệnh bên dưới.
# Thiếu chữ ký thì dịch vụ từ chối quét (503) — không bao giờ coi tệp chưa quét được là sạch.
# freshclam trong image tự hạ xuống user clamav (UID 1000) nên thư mục chữ ký phải do UID đó ghi được;
# thiếu bước này thì "Tải chữ ký ClamAV lần đầu" luôn thất bại với "Can't create freshclam.dat".
- name: Cho freshclam ghi được thư mục chữ ký (user clamav trong image là UID 1000)
  ansible.builtin.file:
    path: "{{ onebee_box_data }}/clamav"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: onebee_clamav_chu_ky_sau.matched == 0

- name: Tải chữ ký ClamAV lần đầu (khi Box có Internet)
  ansible.builtin.command: >-
    docker run --rm -v {{ onebee_box_data }}/clamav:/var/lib/clamav
    --entrypoint freshclam onebee/clamav-khong-unrar:1.5.4 --datadir=/var/lib/clamav
  when: onebee_clamav_chu_ky_sau.matched == 0
  register: onebee_clamav_tai
  changed_when: onebee_clamav_tai.rc == 0
  failed_when: false

- name: Cảnh báo chưa có chữ ký ClamAV (Box không có Internet)
  ansible.builtin.debug:
    msg: >-
      Chưa tải được chữ ký ClamAV — kho tệp từ chối quét cho tới khi có chữ ký. Nộp ngoại tuyến:
      sudo onebee-box cap-nhat-chu-ky-clamav <thư mục chứa main.cvd, daily.cvd, bytecode.cvd>
  when:
    - onebee_clamav_chu_ky_sau.matched == 0
    - onebee_clamav_tai.rc | default(0) != 0

# freshclam tạo tệp trong thư mục chữ ký và có thể đổi quyền thư mục — đặt lại sau khi tải/chép để lần cài sau không đổi gì.
# Giữ owner là UID 1000 (user clamav trong image) để cập nhật chữ ký về sau chạy được; kho tệp chỉ đọc thư mục này.
- name: Giữ quyền thư mục chữ ký ClamAV ổn định
  ansible.builtin.file:
    path: "{{ onebee_box_data }}/clamav"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Khởi chạy / cập nhật SeaweedFS
  ansible.builtin.command: docker compose up -d --no-deps seaweedfs
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_seaweedfs_up
  changed_when: onebee_seaweedfs_up.stderr is search('Creat|Recreat|Start|Pull')
  retries: 5
  delay: 30
  until: onebee_seaweedfs_up.rc == 0

- name: Khởi chạy / cập nhật dịch vụ cổng tệp
  ansible.builtin.command: >-
    docker compose up -d --no-deps
    {{ '--force-recreate' if (onebee_kho_tep_ma is changed or onebee_clamav_dung is changed) else '' }}
    kho-tep
  args:
    chdir: "{{ onebee_box_dir }}"
  register: onebee_kho_tep_up
  changed_when: onebee_kho_tep_up.stderr is search('Creat|Recreat|Start|Pull')
  retries: 5
  delay: 30
  until: onebee_kho_tep_up.rc == 0

# SeaweedFS khởi động lần đầu trên máy chậm có thể lâu hơn một phút (filer đăng ký với master);
# chờ tối đa 4,5 phút trước khi coi là hỏng, kèm chẩn đoán để lần sau đọc được ngay.
- name: Chờ dịch vụ cổng tệp và SeaweedFS sẵn sàng
  block:
    - name: Chờ dịch vụ cổng tệp và SeaweedFS sẵn sàng
      ansible.builtin.command: >-
        docker exec onebee-kho-tep python3 -I -c
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/suc-khoe', timeout=5)"
      register: onebee_kho_tep_san_sang
      until: onebee_kho_tep_san_sang.rc == 0
      retries: 90
      delay: 3
      changed_when: false
  rescue:
    - name: Đọc trạng thái container khi kho tệp chưa sẵn sàng
      ansible.builtin.command: docker compose ps --all
      args:
        chdir: "{{ onebee_box_dir }}"
      register: onebee_kho_tep_ps
      changed_when: false
      failed_when: false

    - name: In trạng thái container khi kho tệp chưa sẵn sàng
      ansible.builtin.debug:
        msg: "{{ onebee_kho_tep_ps.stdout }}"

    - name: Đọc nhật ký SeaweedFS khi kho tệp chưa sẵn sàng
      ansible.builtin.command: docker logs --tail 80 onebee-seaweedfs
      register: onebee_seaweedfs_nhat_ky
      changed_when: false
      failed_when: false

    - name: In nhật ký SeaweedFS khi kho tệp chưa sẵn sàng
      ansible.builtin.debug:
        msg: "{{ onebee_seaweedfs_nhat_ky.stdout }}{{ onebee_seaweedfs_nhat_ky.stderr }}"

    - name: Dừng bộ cài vì kho tệp chưa sẵn sàng
      ansible.builtin.fail:
        msg: "Kho tệp chưa sẵn sàng sau 4,5 phút — xem trạng thái và nhật ký SeaweedFS ở trên."
