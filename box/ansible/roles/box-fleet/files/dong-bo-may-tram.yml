---
# Đẩy cấu hình từ Box xuống máy trạm (lệnh: sudo onebee-box dong-bo-may <tên>|--tat-ca). Cấu hình dựng sẵn trên Box, mỗi máy một file
# ${onebee_cau_hinh_dir}/<tên>.env. Lệnh onebee-box chỉ gọi playbook này cho máy đã CHỨNG MINH là máy đã cấp (biết mật khẩu kho sao lưu)
# và đã ghim khóa SSH — không bao giờ đẩy bí mật tới máy chưa qua bước đó. Mọi task đụng nội dung cấu hình đều no_log.
- name: Đồng bộ cấu hình máy trạm OneBee từ Box
  hosts: may_tram
  become: true
  gather_facts: false
  tasks:
    - name: Đọc cấu hình đang có trên máy
      ansible.builtin.slurp:
        src: /etc/onebee/may-tram.env
      register: onebee_cfg
      no_log: true

    # Lớp phụ (định danh chính là khóa SSH đã ghim + chứng minh mật khẩu kho): tên trong file phải là tên đang vào
    - name: Kiểm tra đúng máy {{ inventory_hostname }}
      ansible.builtin.assert:
        that: ("MAY_TRAM=" ~ inventory_hostname) in (onebee_cfg.content | b64decode).splitlines() | map('trim') | list
        fail_msg: "Máy ở địa chỉ này không phải {{ inventory_hostname }} — không đẩy cấu hình"
        quiet: true

    # Lớp phụ: dòng bắt buộc phải có giá trị (onebee-box đã kiểm trước khi dựng file; kiểm lại vì file sắp ghi đè cấu hình đang chạy được)
    - name: Kiểm cấu hình sắp đẩy đủ các dòng bắt buộc, không rỗng
      ansible.builtin.assert:
        that:
          - cau_hinh is search('(?m)^RESTIC_REPOSITORY=rest:https?://[^:@/]+:[^@/]+@')
          - cau_hinh is search('(?m)^RESTIC_PASSWORD=[^\\s]+')
          - cau_hinh is search('(?m)^QUAN_TRI_SSH_KEY="ssh-ed25519 ')
          - cau_hinh is search('(?m)^BOX_CA=[A-Za-z0-9+/=]{100,}$')
          - cau_hinh is search('(?m)^BOX_CA_VAN_TAY=[0-9a-f]{64}$')
          - cau_hinh is search('(?m)^BOX_HTTPS=[01]$')
        fail_msg: "Cấu hình dựng cho {{ inventory_hostname }} thiếu dòng bắt buộc — không đẩy"
        quiet: true
      vars:
        cau_hinh: "{{ lookup('ansible.builtin.file', onebee_cau_hinh_dir ~ '/' ~ inventory_hostname ~ '.env') }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Ghi cấu hình mới (giữ bản cũ cạnh file, quyền 600)
      ansible.builtin.copy:
        src: "{{ onebee_cau_hinh_dir }}/{{ inventory_hostname }}.env"
        dest: /etc/onebee/may-tram.env
        owner: root
        group: root
        mode: "0600"
        backup: true
      no_log: true
      register: onebee_cfg_moi

    # Các tệp sinh từ cấu hình (CA tin cậy + trình duyệt, cấu hình lệnh hoi, mục menu) dựng lại bằng CHÍNH các task của bộ cài desktop
    # (role chép từ repo vào Box ở box-fleet) — một nguồn duy nhất, không có bản sao thứ hai để lệch nhau.
    # CA trước, để báo cáo bên dưới đã dùng được địa chỉ https
    - name: Cài / gỡ CA của Box (kiểm vân tay + ràng buộc tên rồi mới cài)
      ansible.builtin.include_role:
        name: ket-noi-box

    # CA phải đã được cài ĐÚNG bản vừa đẩy (role chỉ cảnh báo khi CA không đạt kiểm tra) — mới được tính là máy đã nhận CA
    - name: Đọc dấu CA đã cài trên máy
      ansible.builtin.slurp:
        src: /var/lib/onebee/ket-noi-box
      register: onebee_dau_ca

    - name: Kiểm máy đã cài đúng CA vừa đẩy
      ansible.builtin.assert:
        that: (onebee_dau_ca.content | b64decode | trim) == van_tay
        fail_msg: "Máy {{ inventory_hostname }} chưa cài CA vừa đẩy (vân tay không đạt kiểm tra?) — xem cảnh báo ở trên"
        quiet: true
      vars:
        van_tay: >-
          {{ lookup('ansible.builtin.file', onebee_cau_hinh_dir ~ '/' ~ inventory_hostname ~ '.env')
             | regex_findall('(?m)^BOX_CA_VAN_TAY=([0-9a-f]{64})$') | first }}
      no_log: true

    - name: Ghi dấu trên Box — máy này đã nhận CA
      ansible.builtin.copy:
        content: "{{ van_tay }}\n"
        dest: "{{ onebee_dau_ca_dir }}/{{ inventory_hostname }}"
        owner: root
        group: root
        mode: "0600"
      vars:
        van_tay: >-
          {{ lookup('ansible.builtin.file', onebee_cau_hinh_dir ~ '/' ~ inventory_hostname ~ '.env')
             | regex_findall('(?m)^BOX_CA_VAN_TAY=([0-9a-f]{64})$') | first }}
      delegate_to: localhost
      become: false

    - name: Đọc lại cấu hình máy trạm vừa ghi
      ansible.builtin.include_role:
        name: backup-client
        tasks_from: doc-cau-hinh

    - name: Cập nhật cấu hình lệnh hoi
      ansible.builtin.include_role:
        name: ai-cli
        tasks_from: cau-hinh-hoi

    - name: Cập nhật mục menu Báo cần hỗ trợ
      ansible.builtin.include_role:
        name: quan-ly-tap-trung
        tasks_from: muc-menu

    # Báo cáo thành công = khóa tình trạng và địa chỉ mới dùng được. Lỗi thì dừng để quản trị biết (bản cũ còn trong /etc/onebee)
    - name: Gửi tình trạng về Box bằng cấu hình mới
      ansible.builtin.command: /usr/local/sbin/onebee-bao-tinh-trang
      changed_when: false

    - name: Kết quả
      ansible.builtin.debug:
        msg: >-
          {{ ('Đã cập nhật cấu hình máy ' if onebee_cfg_moi is changed else 'Cấu hình đã đúng, không đổi: máy ') ~ inventory_hostname }}
