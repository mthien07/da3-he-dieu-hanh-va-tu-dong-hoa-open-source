---
# OneBee Box v0.1 — máy chủ nội bộ: AI chạy tại chỗ, tự động hóa n8n, thư mục chung, sao lưu, giám sát
- name: OneBee Box
  hosts: box
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
  roles:
    - box-base
    - docker
    - box-firewall   # trước khi mở dịch vụ: từ lần chạy đầu chỉ mạng LAN vào được
    - samba
    - box-stack
    - box-dinh-danh   # đăng nhập một lần (Authelia): cấu hình, tệp người dùng, bí mật rồi mới chạy dịch vụ
    - box-du-lieu     # PostgreSQL + API tự sinh (PostgREST) sau cầu nối danh tính: lược đồ có ghi sổ, RLS
    - box-kho-tep     # SeaweedFS + dịch vụ cổng /files/ và kiểm dịch ClamAV từng lượt (sau khi CSDL đã có lược đồ)
    - box-ai
    - box-n8n
    - box-backup
    - box-fleet
